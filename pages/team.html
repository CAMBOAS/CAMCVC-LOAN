<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){document.documentElement.style.visibility='';})();</script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <title>Team - HELEN LOAN</title>
  <link rel="icon" type="image/png" href="../images/logo/LOGO.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/glass-admin.css?v=5">
  <link rel="stylesheet" href="../assets/css/main.css?v=5">
  <style>
    .orb{display:none!important}.background{background:#27272a!important}.background::before{display:none!important}
    body{background:#27272a!important}.sidebar{background:#27272a!important}
    [data-theme="light"] .background{background:#f8fafc!important}[data-theme="light"] body{background:#f8fafc!important}
    [data-theme="light"] .sidebar{background:#f8fafc!important}
    html[data-theme="light"] .header-shell,html[data-theme="light"] .shared-topbar{background:#ffffff!important;border-bottom-color:rgba(0,0,0,.09)!important}
    .sb-logo-wrap{background:transparent!important;border-color:transparent!important;box-shadow:none!important}
    .sb-user-card{border-color:transparent!important;background:transparent!important}.sb-user-avatar{box-shadow:none!important}
    .main-content{padding:0!important}

    :root {
      --tm-card:#ffffff;--tm-text:#0f172a;--tm-muted:#64748b;
      --tm-border:rgba(148,163,184,.2);--tm-shadow:0 2px 12px rgba(0,0,0,.07);
    }
    [data-theme="dark"] {
      --tm-card:#1e293b;--tm-text:#f1f5f9;--tm-muted:#94a3b8;
      --tm-border:rgba(148,163,184,.12);--tm-shadow:0 2px 16px rgba(0,0,0,.4);
    }

    .tm-wrap { padding:16px 20px 40px; overflow-y:auto; height:calc(100vh - 64px); box-sizing:border-box }
    @media(max-width:980px){ .tm-wrap{ height:auto; padding:12px 12px 100px } }

    .tm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px }
    @media(max-width:480px){ .tm-grid{ grid-template-columns:repeat(2,1fr); gap:10px } }

    /* ── Card ── */
    .tm-card {
      background:var(--tm-card); border-radius:18px; border:1px solid var(--tm-border);
      box-shadow:var(--tm-shadow); padding:22px 16px 18px; position:relative;
      display:flex; flex-direction:column; align-items:center; gap:0;
      transition:.15s; cursor:pointer;
    }
    .tm-card:hover { border-color:rgba(124,92,255,.35); box-shadow:0 6px 24px rgba(124,92,255,.13); transform:translateY(-2px) }
    .tm-card:active { transform:translateY(0) }

    /* ── Avatar wrapper ── */
    .tm-av-wrap { position:relative; margin-bottom:12px; flex-shrink:0 }
    .tm-av {
      width:72px; height:72px; border-radius:50%; overflow:hidden;
      border:3px solid rgba(124,92,255,.2); background:rgba(124,92,255,.1);
      display:flex; align-items:center; justify-content:center;
      font-size:26px; font-weight:800; color:#7c5cff; transition:.15s;
    }
    .tm-card:hover .tm-av { border-color:rgba(124,92,255,.5) }
    .tm-av img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block }

    /* ── Status dot ── */
    .tm-status-dot { position:absolute; bottom:1px; right:1px; width:18px; height:18px; border-radius:50%; border:3px solid var(--tm-card) }
    .tm-status-dot.online  { background:#22c55e; animation:tmPulse 1.8s ease-in-out infinite }
    .tm-status-dot.offline { background:#94a3b8 }
    @keyframes tmPulse { 0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.6)} 50%{box-shadow:0 0 0 6px rgba(34,197,94,0)} }

    /* ── Name & role ── */
    .tm-name { font-size:13.5px; font-weight:800; color:var(--tm-text); margin-bottom:5px; line-height:1.3; text-align:center; word-break:break-word }
    .tm-role { display:inline-block; font-size:10px; font-weight:700; padding:2px 10px; border-radius:20px; margin-bottom:6px }
    .tm-role-admin { background:rgba(124,92,255,.12); color:#7c5cff }
    .tm-role-owner { background:rgba(245,158,11,.12); color:#d97706 }
    .tm-role-staff  { background:rgba(59,130,246,.12); color:#2563eb }

    .tm-exp { font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:6px; margin-bottom:6px }
    .tm-exp-ok   { background:rgba(16,185,129,.12); color:#059669 }
    .tm-exp-warn { background:rgba(245,158,11,.12);  color:#d97706 }
    .tm-exp-red  { background:rgba(239,68,68,.12);   color:#dc2626 }

    .tm-online-badge { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; color:#16a34a; background:rgba(34,197,94,.12); border-radius:20px; padding:2px 8px; margin-bottom:10px }
    .tm-online-badge-dot { width:6px; height:6px; border-radius:50%; background:#22c55e; flex-shrink:0 }

    .tm-divider { width:100%; height:1px; background:var(--tm-border); margin:0 0 14px }

    .tm-stats { display:flex; gap:0; width:100%; margin-bottom:14px }
    .tm-stat { flex:1; text-align:center; padding:0 4px }
    .tm-stat + .tm-stat { border-left:1px solid var(--tm-border) }
    .tm-stat-val { font-size:18px; font-weight:800; color:var(--tm-text); line-height:1; margin-bottom:3px; font-variant-numeric:tabular-nums }
    .tm-stat-lbl { font-size:9px; font-weight:700; color:var(--tm-muted); text-transform:uppercase; letter-spacing:.05em }

    .tm-last { font-size:10.5px; color:var(--tm-muted); text-align:center }

    /* ── Unread badge ── */
    .tm-unread {
      position:absolute; top:10px; right:10px;
      min-width:20px; height:20px; border-radius:10px; padding:0 5px;
      background:#ef4444; color:#fff; font-size:10px; font-weight:800;
      display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;
    }

    .tm-state { display:flex; align-items:center; justify-content:center; min-height:200px; color:var(--tm-muted); font-size:13px }
    .tm-spin  { width:26px; height:26px; border:3px solid rgba(124,92,255,.2); border-top-color:#7c5cff; border-radius:50%; animation:tmSpin .7s linear infinite; margin-right:10px; flex-shrink:0 }
    @keyframes tmSpin{ to{ transform:rotate(360deg) } }

    /* ══════════════════════════════
       PROFILE MODAL
    ══════════════════════════════ */
    .pm-backdrop { position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,.45); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity .2s }
    .pm-backdrop.pm-open { opacity:1; pointer-events:auto }
    .pm-box { background:var(--tm-card); border-radius:24px; border:1px solid var(--tm-border); box-shadow:0 24px 60px rgba(0,0,0,.25); width:100%; max-width:360px; position:relative; overflow:hidden; transform:translateY(20px) scale(.97); transition:transform .22s, opacity .22s; opacity:0 }
    .pm-backdrop.pm-open .pm-box { transform:translateY(0) scale(1); opacity:1 }
    .pm-header { background:linear-gradient(135deg,rgba(124,92,255,.18) 0%,rgba(99,102,241,.08) 100%); padding:32px 24px 20px; display:flex; flex-direction:column; align-items:center; gap:0; border-bottom:1px solid var(--tm-border) }
    .pm-close { position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; border:none; background:rgba(148,163,184,.15); color:var(--tm-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s }
    .pm-close:hover { background:rgba(239,68,68,.15); color:#dc2626 }
    .pm-av-wrap { position:relative; margin-bottom:14px }
    .pm-av { width:100px; height:100px; border-radius:50%; overflow:hidden; border:4px solid rgba(124,92,255,.25); background:rgba(124,92,255,.1); display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:800; color:#7c5cff; flex-shrink:0 }
    .pm-av img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block }
    .pm-status-dot { position:absolute; bottom:4px; right:4px; width:20px; height:20px; border-radius:50%; border:3px solid var(--tm-card) }
    .pm-status-dot.online  { background:#22c55e; animation:tmPulse 1.8s ease-in-out infinite }
    .pm-status-dot.offline { background:#94a3b8 }
    .pm-name { font-size:17px; font-weight:800; color:var(--tm-text); margin-bottom:6px; text-align:center }
    .pm-badges { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center }
    .pm-body { padding:20px 24px 24px; display:flex; flex-direction:column; gap:16px }
    .pm-stats { display:flex; gap:0; border:1px solid var(--tm-border); border-radius:14px; overflow:hidden }
    .pm-stat { flex:1; padding:14px 8px; text-align:center; background:rgba(124,92,255,.04) }
    .pm-stat + .pm-stat { border-left:1px solid var(--tm-border) }
    .pm-stat-val { font-size:22px; font-weight:800; color:#7c5cff; line-height:1; margin-bottom:4px; font-variant-numeric:tabular-nums }
    .pm-stat-lbl { font-size:9px; font-weight:700; color:var(--tm-muted); text-transform:uppercase; letter-spacing:.05em }
    .pm-info-row { display:flex; flex-direction:column; gap:10px }
    .pm-info-item { display:flex; align-items:center; justify-content:space-between; gap:8px }
    .pm-info-label { font-size:11px; font-weight:700; color:var(--tm-muted); text-transform:uppercase; letter-spacing:.05em }
    .pm-info-val { font-size:12.5px; font-weight:700; color:var(--tm-text) }
    .pm-status-dot-inline { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; flex-shrink:0 }
    .pm-status-active   { background:#10b981 }
    .pm-status-inactive { background:#94a3b8 }
    /* Message button */
    .pm-msg-btn { width:100%; padding:12px; border-radius:12px; border:none; background:linear-gradient(135deg,#7c3aed,#6d28d9); color:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 4px 14px rgba(124,58,237,.3); display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s }
    .pm-msg-btn:hover { opacity:.9 }

    /* ══════════════════════════════
       CHAT MODAL
    ══════════════════════════════ */
    .chat-bd { position:fixed; inset:0; z-index:1100; background:transparent; pointer-events:none; }
    .chat-bd.chat-open { pointer-events:none; }

    .chat-box {
      position:fixed; bottom:24px; right:24px;
      background:var(--tm-card); border-radius:22px; border:1px solid var(--tm-border);
      box-shadow:0 8px 40px rgba(0,0,0,.18); width:360px; max-width:calc(100vw - 32px);
      height:min(560px, calc(100vh - 120px)); display:flex; flex-direction:column;
      transform:translateY(30px) scale(.95); transition:transform .25s, opacity .25s; opacity:0; overflow:hidden;
      pointer-events:none; z-index:1100;
    }
    .chat-bd.chat-open .chat-box { transform:translateY(0) scale(1); opacity:1; pointer-events:auto; }
    @media(max-width:480px){
      .chat-box{ bottom:80px; right:12px; left:12px; width:auto; }
    }

    /* Header */
    .chat-hd {
      display:flex; align-items:center; gap:10px; padding:14px 16px;
      background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(99,102,241,.06));
      border-bottom:1px solid var(--tm-border); flex-shrink:0;
    }
    .chat-hd-av-wrap { position:relative; flex-shrink:0 }
    .chat-hd-av { width:42px; height:42px; border-radius:50%; overflow:hidden; border:2.5px solid rgba(124,92,255,.3); background:rgba(124,92,255,.1); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:#7c5cff }
    .chat-hd-av img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block }
    .chat-hd-sdot { position:absolute; bottom:0; right:0; width:12px; height:12px; border-radius:50%; border:2px solid var(--tm-card) }
    .chat-hd-sdot.online  { background:#22c55e; animation:tmPulse 1.8s ease-in-out infinite }
    .chat-hd-sdot.offline { background:#94a3b8 }
    .chat-hd-info { flex:1; min-width:0 }
    .chat-hd-name { font-size:14px; font-weight:800; color:var(--tm-text); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .chat-hd-sub  { font-size:11px; color:var(--tm-muted); margin-top:1px }
    .chat-hd-sub.online { color:#16a34a }
    .chat-close-x { width:32px; height:32px; border-radius:50%; border:none; background:rgba(148,163,184,.15); color:var(--tm-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:.15s }
    .chat-close-x:hover { background:rgba(239,68,68,.15); color:#dc2626 }

    /* Messages area */
    .chat-msgs { flex:1; overflow-y:auto; padding:14px 14px 4px; display:flex; flex-direction:column; gap:2px; scroll-behavior:smooth }
    .chat-msgs::-webkit-scrollbar { width:4px }
    .chat-msgs::-webkit-scrollbar-thumb { background:rgba(148,163,184,.3); border-radius:2px }

    .chat-date-sep { text-align:center; margin:10px 0 4px }
    .chat-date-sep span { font-size:10px; font-weight:700; color:var(--tm-muted); background:rgba(148,163,184,.12); padding:3px 10px; border-radius:10px }

    .chat-row { display:flex; margin:2px 0 }
    .chat-row.mine   { justify-content:flex-end }
    .chat-row.theirs { justify-content:flex-start }

    .chat-bubble { max-width:75%; border-radius:16px; padding:9px 12px; word-break:break-word; line-height:1.5 }
    .chat-bubble.mine   { background:linear-gradient(135deg,#7c3aed,#6d28d9); color:#fff; border-bottom-right-radius:4px }
    .chat-bubble.theirs { background:rgba(148,163,184,.15); color:var(--tm-text); border-bottom-left-radius:4px }
    [data-theme="dark"] .chat-bubble.theirs { background:rgba(148,163,184,.2) }

    .chat-img-msg { max-width:220px; border-radius:10px; display:block; cursor:zoom-in; margin-bottom:4px }
    .chat-text { font-size:13.5px }
    .chat-ts { font-size:9.5px; opacity:.6; margin-top:4px; text-align:right }
    .chat-bubble.theirs .chat-ts { text-align:left }

    .chat-empty-txt { text-align:center; color:var(--tm-muted); font-size:13px; margin:auto; padding:20px 0 }
    .chat-loading { display:flex; align-items:center; justify-content:center; padding:30px 0 }
    .chat-spin-sm { width:22px; height:22px; border:3px solid rgba(124,92,255,.2); border-top-color:#7c5cff; border-radius:50%; animation:tmSpin .7s linear infinite }

    /* Image preview bar */
    .chat-img-prev { display:none; align-items:center; gap:10px; padding:8px 14px; background:rgba(124,92,255,.06); border-top:1px solid var(--tm-border); flex-shrink:0 }
    .chat-img-prev img { height:56px; border-radius:8px; object-fit:cover }
    .chat-img-prev-rm { background:rgba(239,68,68,.12); color:#ef4444; border:none; border-radius:50%; width:24px; height:24px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0 }

    /* Input row */
    .chat-input-row { display:flex; align-items:center; gap:8px; padding:10px 14px 12px; border-top:1px solid var(--tm-border); flex-shrink:0 }
    .chat-img-btn { width:36px; height:36px; border-radius:10px; border:1.5px solid var(--tm-border); background:transparent; color:var(--tm-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:.15s }
    .chat-img-btn:hover { border-color:#7c5cff; color:#7c5cff }
    .chat-input { flex:1; padding:9px 13px; border-radius:12px; border:1.5px solid var(--tm-border); background:rgba(148,163,184,.08); color:var(--tm-text); font-size:13.5px; font-family:inherit; outline:none; transition:.15s; resize:none }
    .chat-input:focus { border-color:#7c5cff }
    .chat-send-btn { width:38px; height:38px; border-radius:12px; border:none; background:linear-gradient(135deg,#7c3aed,#6d28d9); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:.15s }
    .chat-send-btn:hover { opacity:.85 }
    .chat-send-btn:disabled { opacity:.4; cursor:default }
  </style>
</head>
<body>
<div class="dashboard">
  <div class="sidebar-overlay"></div>
  <aside class="sidebar" id="sharedSidebar"></aside>
  <main class="main-content" id="mainContent">
    <div class="shared-topbar" id="sharedHeader"></div>
    <div class="tm-wrap">
      <div id="tmState" class="tm-state"><div class="tm-spin"></div><span>Loading…</span></div>
      <div class="tm-grid" id="tmGrid" style="display:none"></div>
    </div>
  </main>
</div>

<!-- Profile Modal -->
<div class="pm-backdrop" id="pmBackdrop" onclick="handlePmBdClick(event)">
  <div class="pm-box" id="pmBox">
    <button class="pm-close" onclick="closeProfile()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="pm-header">
      <div class="pm-av-wrap">
        <div class="pm-av" id="pmAv"></div>
        <span class="pm-status-dot offline" id="pmStatusDot"></span>
      </div>
      <div class="pm-name" id="pmName"></div>
      <div class="pm-badges" id="pmBadges"></div>
    </div>
    <div class="pm-body">
      <div class="pm-stats">
        <div class="pm-stat"><div class="pm-stat-val" id="pmAdded">0</div><div class="pm-stat-lbl">Loans Added</div></div>
        <div class="pm-stat"><div class="pm-stat-val" id="pmEdited">0</div><div class="pm-stat-lbl">Loans Edited</div></div>
      </div>
      <div class="pm-info-row">
        <div class="pm-info-item">
          <span class="pm-info-label">Status</span>
          <span class="pm-info-val" id="pmStatus"></span>
        </div>
        <div class="pm-info-item">
          <span class="pm-info-label">Expires</span>
          <span class="pm-info-val" id="pmExpires"></span>
        </div>
        <div class="pm-info-item">
          <span class="pm-info-label">Last Login</span>
          <span class="pm-info-val" id="pmLastLogin"></span>
        </div>
      </div>
      <button class="pm-msg-btn" id="pmMsgBtn" onclick="openChatFromProfile()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Message
      </button>
    </div>
  </div>
</div>

<!-- Chat Modal -->
<div class="chat-bd" id="chatBd" onclick="handleChatBdClick(event)">
  <div class="chat-box" id="chatBox">
    <div class="chat-hd">
      <div class="chat-hd-av-wrap">
        <div class="chat-hd-av" id="chatHdAv"></div>
        <span class="chat-hd-sdot offline" id="chatHdDot"></span>
      </div>
      <div class="chat-hd-info">
        <div class="chat-hd-name" id="chatHdName"></div>
        <div class="chat-hd-sub" id="chatHdSub">Offline</div>
      </div>
      <button class="chat-close-x" onclick="closeChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="chat-msgs" id="chatMsgs"><div class="chat-loading"><div class="chat-spin-sm"></div></div></div>
    <div class="chat-img-prev" id="chatImgPrev">
      <img id="chatImgPrevImg" src="" alt="">
      <button class="chat-img-prev-rm" onclick="clearChatImg()" title="Remove">✕</button>
    </div>
    <div class="chat-input-row">
      <input type="file" id="chatFile" accept="image/*" style="display:none">
      <button class="chat-img-btn" onclick="document.getElementById('chatFile').click()" title="Send image">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <input class="chat-input" id="chatInput" type="text" placeholder="Type a message…"
             onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMsg();}">
      <button class="chat-send-btn" id="chatSendBtn" onclick="sendChatMsg()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="../assets/js/layout.js?v=15"></script>
<script src="../assets/js/dashboard-layout.js?v=1"></script>
<script src="../assets/js/auth.js?v=2"></script>
<script src="../assets/js/api.js?v=8"></script>
<script>
'use strict';

var _users       = [];
var _pmCurIdx    = null;
var _chatWith    = null;
var _chatU       = null;
var _chatPoll    = null;
var _chatImg     = '';

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function getMyUsername(){ try{ var a=JSON.parse(localStorage.getItem('helenAuth')||'null'); return a?(a.u||''):''; }catch(e){return '';} }

function isOnline(dtStr) {
  if (!dtStr) return false;
  try {
    var s = String(dtStr).trim().replace(' ','T');
    if (!/Z$|[+-]\d{2}:\d{2}$/.test(s)) s += 'Z';
    var ms = new Date(s).getTime();
    return !isNaN(ms) && (Date.now()-ms) < 10*60*1000;
  } catch(e){ return false; }
}

function fmtLastActive(dtStr) {
  if (!dtStr) return 'Never';
  try {
    var s = String(dtStr).trim().replace(' ','T');
    if (!/Z$|[+-]\d{2}:\d{2}$/.test(s)) s += 'Z';
    var d = new Date(s); if (isNaN(d.getTime())) return '—';
    var TZ='Asia/Phnom_Penh';
    var parts=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(d);
    var p={}; parts.forEach(function(x){p[x.type]=x.value;});
    var h24=parseInt(p.hour,10),ampm=h24>=12?'PM':'AM',h12=h24%12||12;
    var ppDate=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d);
    var nowDate=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
    var dp=(ppDate===nowDate)?'Today':p.day+'/'+p.month+'/'+p.year.slice(2);
    return dp+' '+String(h12).padStart(2,'0')+':'+p.minute+' '+ampm;
  } catch(e){ return '—'; }
}

function fmtExpiry(expDate) {
  if (!expDate) return '—';
  var ms=new Date(String(expDate)+'T23:59:59').getTime();
  var d=Math.ceil((ms-Date.now())/86400000);
  var parts=String(expDate).split('-');
  var label=parts.length===3?parts[2]+'/'+parts[1]+'/'+parts[0]:expDate;
  if (d<=0)  return label+' <span style="color:#dc2626;font-size:10px">(Expired)</span>';
  if (d<=7)  return label+' <span style="color:#d97706;font-size:10px">('+d+' days)</span>';
  return label+' <span style="color:#059669;font-size:10px">('+d+' days)</span>';
}

function expBadge(expDate) {
  if (!expDate) return '';
  var ms=new Date(String(expDate)+'T23:59:59').getTime();
  var d=Math.ceil((ms-Date.now())/86400000);
  if (d<=0) return '<span class="tm-exp tm-exp-red">Expired</span>';
  if (d<=7) return '<span class="tm-exp tm-exp-warn">'+d+' days</span>';
  return '<span class="tm-exp tm-exp-ok">'+d+' days</span>';
}

function roleCls(role) {
  var r=(role||'').toLowerCase();
  if (r.indexOf('admin')!==-1) return 'tm-role-admin';
  if (r.indexOf('owner')!==-1) return 'tm-role-owner';
  return 'tm-role-staff';
}

function renderCard(u, idx) {
  var name=u.display_name||u.username||'?';
  var init=name.charAt(0).toUpperCase();
  var photo=u.photo_url||'';
  var avInner=photo
    ?'<img src="'+esc(photo)+'" alt="'+esc(init)+'" onerror="this.parentNode.innerHTML=\''+esc(init)+'\'">'
    :esc(init);
  var online=isOnline(u.last_seen);
  return '<div class="tm-card" data-username="'+esc(u.username)+'" onclick="openCard('+idx+')">'
    +'<div class="tm-av-wrap">'
      +'<div class="tm-av">'+avInner+'</div>'
      +'<span class="tm-status-dot '+(online?'online':'offline')+'" title="'+(online?'Online':'Offline')+'"></span>'
    +'</div>'
    +'<div class="tm-name">'+esc(name)+'</div>'
    +'<span class="tm-role '+roleCls(u.role)+'">'+esc(u.role||'Staff')+'</span>'
    +expBadge(u.exp_date)
    +(online?'<span class="tm-online-badge"><span class="tm-online-badge-dot"></span>Online</span>':'')
    +'<div class="tm-divider"></div>'
    +'<div class="tm-stats">'
      +'<div class="tm-stat"><div class="tm-stat-val">'+Number(u.loans_added||0)+'</div><div class="tm-stat-lbl">Added</div></div>'
      +'<div class="tm-stat"><div class="tm-stat-val">'+Number(u.loans_edited||0)+'</div><div class="tm-stat-lbl">Edited</div></div>'
    +'</div>'
    +'<div class="tm-divider"></div>'
    +'<div class="tm-last">Last login: '+fmtLastActive(u.last_login||'')+'</div>'
    +'</div>';
}

function openCard(idx) {
  var u = _users[idx];
  if (!u) return;
  if (u.username === getMyUsername()) {
    openProfile(idx); // own card → profile
  } else {
    openProfile(idx); // show profile first, user clicks Message to chat
  }
}

/* ── Profile Modal ── */
function openProfile(idx) {
  var u = _users[idx]; if (!u) return;
  _pmCurIdx = idx;
  var name=u.display_name||u.username||'?';
  var init=name.charAt(0).toUpperCase();
  var photo=u.photo_url||'';
  var avEl=document.getElementById('pmAv');
  avEl.innerHTML=photo?'<img src="'+esc(photo)+'" alt="'+esc(init)+'" onerror="this.parentNode.innerHTML=\''+esc(init)+'\'">'  :esc(init);
  document.getElementById('pmName').textContent=name;
  var dotEl=document.getElementById('pmStatusDot');
  dotEl.className='pm-status-dot '+(isOnline(u.last_seen)?'online':'offline');
  dotEl.title=isOnline(u.last_seen)?'Online':'Offline';
  var rc=roleCls(u.role);
  document.getElementById('pmBadges').innerHTML='<span class="tm-role '+rc+'">'+esc(u.role||'Staff')+'</span>'+expBadge(u.exp_date);
  document.getElementById('pmAdded').textContent=Number(u.loans_added||0);
  document.getElementById('pmEdited').textContent=Number(u.loans_edited||0);
  var isActive=(u.status||'active')==='active';
  document.getElementById('pmStatus').innerHTML='<span class="pm-status-dot-inline '+(isActive?'pm-status-active':'pm-status-inactive')+'"></span>'+(isActive?'Active':'Inactive');
  document.getElementById('pmExpires').innerHTML=fmtExpiry(u.exp_date);
  document.getElementById('pmLastLogin').textContent=fmtLastActive(u.last_login||'');
  var msgBtn=document.getElementById('pmMsgBtn');
  msgBtn.style.display=(u.username===getMyUsername())?'none':'flex';
  document.getElementById('pmBackdrop').classList.add('pm-open');
  document.body.style.overflow='hidden';
}

function closeProfile() {
  document.getElementById('pmBackdrop').classList.remove('pm-open');
  document.body.style.overflow='';
}

function handlePmBdClick(e) { if(e.target===document.getElementById('pmBackdrop')) closeProfile(); }

function openChatFromProfile() {
  if (_pmCurIdx==null) return;
  closeProfile();
  setTimeout(function(){ openChat(_pmCurIdx); }, 200);
}

/* ── Chat ── */
function openChat(idx) {
  var u=_users[idx]; if (!u) return;
  _chatWith=u.username; _chatU=u;
  var name=u.display_name||u.username||'?';
  var init=name.charAt(0).toUpperCase();
  var photo=u.photo_url||'';
  var avEl=document.getElementById('chatHdAv');
  avEl.innerHTML=photo?'<img src="'+esc(photo)+'" alt="'+esc(init)+'" onerror="this.parentNode.innerHTML=\''+esc(init)+'\'">'  :esc(init);
  document.getElementById('chatHdName').textContent=name;
  var online=isOnline(u.last_seen);
  var dot=document.getElementById('chatHdDot');
  var sub=document.getElementById('chatHdSub');
  dot.className='chat-hd-sdot '+(online?'online':'offline');
  sub.textContent=online?'Online':'Offline';
  sub.className='chat-hd-sub'+(online?' online':'');
  _chatImg='';
  document.getElementById('chatImgPrev').style.display='none';
  document.getElementById('chatInput').value='';
  document.getElementById('chatMsgs').innerHTML='<div class="chat-loading"><div class="chat-spin-sm"></div></div>';
  document.getElementById('chatBd').classList.add('chat-open');
  loadChatMsgs(true);
  if (_chatPoll) clearInterval(_chatPoll);
  _chatPoll=setInterval(function(){ loadChatMsgs(false); }, 4000);
  document.getElementById('chatFile').onchange=function(e){
    var f=e.target.files&&e.target.files[0]; if (!f) return;
    uploadChatImg(f); e.target.value='';
  };
  setTimeout(function(){ document.getElementById('chatInput').focus(); }, 300);
}

function closeChat() {
  document.getElementById('chatBd').classList.remove('chat-open');
  if (_chatPoll){ clearInterval(_chatPoll); _chatPoll=null; }
  _chatWith=null; _chatU=null;
  loadUnreadCounts();
}

function handleChatBdClick(e){ if(e.target===document.getElementById('chatBd')) closeChat(); }

async function loadChatMsgs(scrollToBottom) {
  if (!_chatWith) return;
  try {
    var res=await CamboAPI.post({ action:'helen_msg_list', with:_chatWith });
    if (!res||!res.ok) {
      var msgsEl=document.getElementById('chatMsgs');
      if (msgsEl.querySelector('.chat-spin-sm')) {
        msgsEl.innerHTML='<div class="chat-empty-txt" style="color:#ef4444">'+(res&&res.message?res.message:'Could not load messages — retrying…')+'</div>';
      }
      return;
    }
    renderChatMsgs(res.messages||[], scrollToBottom);
    var card=document.querySelector('.tm-card[data-username="'+_chatWith+'"]');
    if (card){ var b=card.querySelector('.tm-unread'); if(b) b.remove(); }
  } catch(e){
    var msgsEl=document.getElementById('chatMsgs');
    if (msgsEl&&msgsEl.querySelector('.chat-spin-sm')) {
      msgsEl.innerHTML='<div class="chat-empty-txt" style="color:#ef4444">Connection error — retrying…</div>';
    }
  }
}

function fmtChatTime(dtStr) {
  try {
    var s=String(dtStr||'').trim().replace(' ','T');
    if (!/Z$|[+-]\d{2}:\d{2}$/.test(s)) s+='Z';
    var d=new Date(s); var TZ='Asia/Phnom_Penh';
    var parts=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour12:false,hour:'2-digit',minute:'2-digit'}).formatToParts(d);
    var p={}; parts.forEach(function(x){p[x.type]=x.value;});
    var h24=parseInt(p.hour,10);
    return (h24%12||12)+':'+p.minute+(h24>=12?' PM':' AM');
  } catch(e){ return ''; }
}

function fmtChatDate(dtStr) {
  try {
    var s=String(dtStr||'').trim().replace(' ','T');
    if (!/Z$|[+-]\d{2}:\d{2}$/.test(s)) s+='Z';
    var d=new Date(s); var TZ='Asia/Phnom_Penh';
    var ppDate=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d);
    var nowDate=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
    var yest=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date(Date.now()-86400000));
    if (ppDate===nowDate) return 'Today';
    if (ppDate===yest)    return 'Yesterday';
    var p=ppDate.split('-'); return p[2]+'/'+p[1]+'/'+p[0].slice(2);
  } catch(e){ return ''; }
}

function renderChatMsgs(msgs, scrollToBottom) {
  var msgsEl=document.getElementById('chatMsgs');
  var myUser=getMyUsername();
  if (!msgs.length) {
    msgsEl.innerHTML='<div class="chat-empty-txt">No messages yet — say hi! 👋</div>';
    return;
  }
  var atBottom=msgsEl.scrollHeight-msgsEl.scrollTop<=msgsEl.clientHeight+80;
  var html='', prevDate='';
  msgs.forEach(function(m){
    var mine=m.sender===myUser;
    var dateStr=fmtChatDate(m.created_at);
    if (dateStr!==prevDate) {
      html+='<div class="chat-date-sep"><span>'+esc(dateStr)+'</span></div>';
      prevDate=dateStr;
    }
    html+='<div class="chat-row '+(mine?'mine':'theirs')+'">';
    html+='<div class="chat-bubble '+(mine?'mine':'theirs')+'">';
    if (m.image_url) html+='<img class="chat-img-msg" src="'+esc(m.image_url)+'" onclick="window.open(\''+esc(m.image_url)+'\',\'_blank\')" loading="lazy">';
    if (m.body)      html+='<div class="chat-text">'+esc(m.body).replace(/\n/g,'<br>')+'</div>';
    html+='<div class="chat-ts">'+esc(fmtChatTime(m.created_at))+'</div>';
    html+='</div></div>';
  });
  msgsEl.innerHTML=html;
  if (scrollToBottom||atBottom) msgsEl.scrollTop=msgsEl.scrollHeight;
}

async function sendChatMsg() {
  if (!_chatWith) return;
  var input=document.getElementById('chatInput');
  var text=(input.value||'').trim();
  var img=_chatImg;
  if (!text&&!img) return;
  var btn=document.getElementById('chatSendBtn');
  btn.disabled=true;
  try {
    await CamboAPI.post({ action:'helen_msg_send', to:_chatWith, body:text, image_url:img });
    input.value=''; clearChatImg();
    await loadChatMsgs(true);
  } catch(e){}
  btn.disabled=false;
  input.focus();
}

async function uploadChatImg(file) {
  var btn=document.getElementById('chatSendBtn'); btn.disabled=true;
  var prevEl=document.getElementById('chatImgPrev');
  var prevImg=document.getElementById('chatImgPrevImg');
  prevEl.style.display='flex'; prevImg.src='';
  var reader=new FileReader();
  reader.onload=async function(ev){
    try {
      var r=await CamboAPI.post({ action:'helen_upload_photo', data:ev.target.result });
      if (!r||!r.ok){ prevEl.style.display='none'; btn.disabled=false; return; }
      _chatImg=r.url; prevImg.src=r.url; btn.disabled=false;
    } catch(e){ prevEl.style.display='none'; btn.disabled=false; }
  };
  reader.readAsDataURL(file);
}

function clearChatImg() {
  _chatImg='';
  document.getElementById('chatImgPrev').style.display='none';
  document.getElementById('chatImgPrevImg').src='';
  document.getElementById('chatFile').value='';
}

/* ── Unread badges ── */
async function loadUnreadCounts() {
  try {
    var res=await CamboAPI.post({ action:'helen_msg_unread' });
    if (!res||!res.ok) return;
    var counts=res.counts||{};
    document.querySelectorAll('.tm-card').forEach(function(card){
      var uname=card.getAttribute('data-username')||'';
      var old=card.querySelector('.tm-unread'); if(old) old.remove();
      var cnt=counts[uname]||0;
      if (cnt>0) {
        var b=document.createElement('div');
        b.className='tm-unread'; b.textContent=cnt>9?'9+':String(cnt);
        card.appendChild(b);
      }
    });
  } catch(e){}
}

document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeChat(); closeProfile(); } });

/* ── Load ── */
document.addEventListener('DOMContentLoaded', async function() {
  if (window.HelenAuth&&!window.HelenAuth.check()) return;
  try {
    var res=await CamboAPI.post({ action:'helen_team_list' });
    var stateEl=document.getElementById('tmState');
    var gridEl=document.getElementById('tmGrid');
    if (!res||!res.ok){ stateEl.textContent=(res&&res.message)||'Error loading team'; return; }
    if (!res.users||!res.users.length){ stateEl.textContent='No team members found'; return; }
    _users=res.users;
    gridEl.innerHTML=_users.map(renderCard).join('');
    gridEl.style.display=''; stateEl.style.display='none';
    loadUnreadCounts();
    setInterval(loadUnreadCounts, 12000);
  } catch(e){ document.getElementById('tmState').textContent='Error loading team'; }
});
</script>
</body>
