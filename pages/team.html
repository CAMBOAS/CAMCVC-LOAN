<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){document.documentElement.style.visibility='';})();</script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <title>Team - CAMCVC LOAN</title>
  <link rel="icon" type="image/png" href="../images/logo/LOGO.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/glass-admin.css?v=5">
  <link rel="stylesheet" href="../assets/css/main.css?v=36">
  <style>
    .orb{display:none!important}.background{background:#0c0e1a!important}.background::before{display:none!important}
    body{background:#0c0e1a!important}
    [data-theme="light"] .background{background:#f8fafc!important}[data-theme="light"] body{background:#f8fafc!important}
    html[data-theme="light"] .header-shell,html[data-theme="light"] .shared-topbar{background:#ffffff!important;border-bottom-color:rgba(0,0,0,.09)!important}
    .sb-logo-wrap{background:transparent!important;border-color:transparent!important;box-shadow:none!important}
    .sb-user-card{border-color:transparent!important;background:transparent!important}.sb-user-avatar{box-shadow:none!important}
    .main-content{padding:0!important}

    :root {
      --tm-card:#ffffff;--tm-text:#0f172a;--tm-muted:#64748b;
      --tm-border:rgba(148,163,184,.2);--tm-shadow:0 2px 12px rgba(0,0,0,.07);
    }
    [data-theme="dark"] {
      --tm-card:#1e293b;--tm-text:#f1f5f9;--tm-muted:#94a3b8;
      --tm-border:rgba(148,163,184,.12);--tm-shadow:0 2px 16px rgba(0,0,0,.4);
    }

    .tm-wrap { padding:16px 20px 40px; overflow-y:auto; height:calc(100vh - 64px); box-sizing:border-box }
    @media(max-width:980px){ .tm-wrap{ height:auto; padding:60px 12px 100px } }

    .tm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px }
    @media(max-width:480px){ .tm-grid{ grid-template-columns:repeat(2,1fr); gap:10px } }

    /* -- Card -- */
    .tm-card {
      background:var(--tm-card); border-radius:18px; border:1px solid var(--tm-border);
      box-shadow:var(--tm-shadow); padding:22px 16px 18px; position:relative;
      display:flex; flex-direction:column; align-items:center; gap:0;
      transition:.15s; cursor:pointer;
    }
    .tm-card:hover { border-color:rgba(124,92,255,.35); box-shadow:0 6px 24px rgba(124,92,255,.13); transform:translateY(-2px) }
    .tm-card:active { transform:translateY(0) }

    /* -- Avatar wrapper -- */
    .tm-av-wrap { position:relative; margin-bottom:12px; flex-shrink:0 }
    .tm-av {
      width:72px; height:72px; border-radius:50%; overflow:hidden;
      border:3px solid rgba(124,92,255,.2); background:rgba(124,92,255,.1);
      display:flex; align-items:center; justify-content:center;
      font-size:26px; font-weight:800; color:#7c5cff; transition:.15s;
    }
    .tm-card:hover .tm-av { border-color:rgba(124,92,255,.5) }
    .tm-av img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block }

    /* -- Status dot -- */
    .tm-status-dot { position:absolute; bottom:1px; right:1px; width:18px; height:18px; border-radius:50%; border:3px solid var(--tm-card) }
    .tm-status-dot.online  { background:#22c55e; animation:tmPulse 1.8s ease-in-out infinite }
    .tm-status-dot.offline { background:#94a3b8 }
    @keyframes tmPulse { 0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.6)} 50%{box-shadow:0 0 0 6px rgba(34,197,94,0)} }

    /* -- Name & role -- */
    .tm-name { font-size:13.5px; font-weight:800; color:var(--tm-text); margin-bottom:5px; line-height:1.3; text-align:center; word-break:break-word }
    /* Text only — the role reads by colour, no pill behind it */
    .tm-role { display:inline-block; font-size:10px; font-weight:700; padding:2px 0; margin-bottom:6px }
    .tm-role-admin { color:#7c5cff }
    .tm-role-owner { color:#d97706 }
    .tm-role-staff  { color:#2563eb }

    /* Text only — the remaining days read by colour, no badge behind them */
    .tm-exp { font-size:9.5px; font-weight:700; padding:2px 0; margin-bottom:6px }
    .tm-exp-ok   { color:#059669 }
    .tm-exp-warn { color:#d97706 }
    .tm-exp-red  { color:#dc2626 }

    .tm-online-badge { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; color:#16a34a; background:rgba(34,197,94,.12); border-radius:20px; padding:2px 8px; margin-bottom:10px }
    .tm-online-badge-dot { width:6px; height:6px; border-radius:50%; background:#22c55e; flex-shrink:0 }

    .tm-divider { width:100%; height:1px; background:var(--tm-border); margin:0 0 14px }

    .tm-stats { display:flex; gap:0; width:100%; margin-bottom:14px }
    .tm-stat { flex:1; text-align:center; padding:0 4px }
    .tm-stat + .tm-stat { border-left:1px solid var(--tm-border) }
    .tm-stat-val { font-size:18px; font-weight:800; color:var(--tm-text); line-height:1; margin-bottom:3px; font-variant-numeric:tabular-nums }
    .tm-stat-lbl { font-size:9px; font-weight:700; color:var(--tm-muted); text-transform:uppercase; letter-spacing:.05em }

    .tm-last { font-size:10.5px; color:var(--tm-muted); text-align:center }

    /* -- Unread badge -- */
    .tm-unread {
      position:absolute; top:10px; right:10px;
      min-width:20px; height:20px; border-radius:10px; padding:0 5px;
      background:#ef4444; color:#fff; font-size:10px; font-weight:800;
      display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;
    }

    .tm-state { display:flex; align-items:center; justify-content:center; min-height:200px; color:var(--tm-muted); font-size:13px }
    .tm-spin  { width:26px; height:26px; border:3px solid rgba(124,92,255,.2); border-top-color:#7c5cff; border-radius:50%; animation:tmSpin .7s linear infinite; margin-right:10px; flex-shrink:0 }
    @keyframes tmSpin{ to{ transform:rotate(360deg) } }

    /* -- Toolbar -- */
    .tm-toolbar { display:flex; align-items:center; justify-content:flex-end; margin-bottom:14px; gap:6px }
    .tm-quota { font-size:11.5px; color:var(--tm-muted); font-weight:700; margin-right:auto }
    .tm-add-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:9px; border:1.5px solid #7c5cff; background:#7c5cff; color:#fff; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; transition:.15s }
    .tm-add-btn:hover { opacity:.9 }
    .tm-add-btn:disabled { opacity:.5; cursor:not-allowed }

    /* -- Manage Teams panel (Assistant access) -- */
    .tm-manage-panel { margin-bottom:18px; display:flex; flex-direction:column; gap:10px }
    .tm-manage-title { font-size:11px; font-weight:800; color:var(--tm-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px }
    .tm-manage-card { background:var(--tm-card); border:1.5px solid rgba(245,158,11,.35); border-radius:14px; padding:14px 16px; box-shadow:var(--tm-shadow) }

    /* -- Compact list: header, search, one-line summary rows -- */
    .tm-manage-hdr { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
    .tm-manage-search { flex:1; min-width:150px; max-width:260px; padding:7px 11px; border-radius:9px; border:1.5px solid var(--tm-border); background:var(--tm-card); color:var(--tm-text); font-size:12px; font-family:inherit; outline:none }
    .tm-manage-search:focus { border-color:#7c5cff }
    #tmManageRows { display:flex; flex-direction:column; gap:8px }
    #tmManageRows .tm-manage-card { padding:0; overflow:hidden }
    .tm-manage-summary { display:flex; align-items:center; gap:9px; padding:10px 14px; cursor:pointer; flex-wrap:wrap; transition:background .15s }
    .tm-manage-summary:hover { background:rgba(245,158,11,.06) }
    .tm-mini-caret { color:var(--tm-muted); font-size:11px; flex-shrink:0; width:10px }
    .tm-mini-name { font-size:13px; font-weight:800; color:var(--tm-text); white-space:nowrap }
    .tm-mini-user { font-size:10.5px; color:var(--tm-muted); white-space:nowrap }
    .tm-mini-tags { display:flex; gap:4px; flex-wrap:wrap; flex:1; min-width:0 }
    .tm-mini-tag { font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:20px; background:rgba(6,182,212,.12); color:#0891b2; white-space:nowrap }
    [data-theme="dark"] .tm-mini-tag { color:#22d3ee }
    .tm-mini-none { font-size:10px; color:var(--tm-muted); font-style:italic }
    .tm-mini-quota { font-size:10.5px; font-weight:800; color:var(--tm-muted); white-space:nowrap; margin-left:auto }
    .tm-manage-body { padding:0 14px 14px; border-top:1px solid var(--tm-border) }
    .tm-manage-body .tm-manage-head { padding-top:12px }
    .tm-manage-nomatch { font-size:12px; color:var(--tm-muted); padding:10px 2px }
    .tm-manage-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap }
    .tm-manage-name-input { font-size:14px; font-weight:800; color:var(--tm-text); background:transparent; border:1.5px solid var(--tm-border); border-radius:8px; padding:5px 9px; font-family:inherit; flex:1; min-width:140px }
    .tm-manage-name-input:focus { border-color:#7c5cff; outline:none }
    .tm-manage-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px }
    .tm-manage-label { font-size:10.5px; font-weight:700; color:var(--tm-muted); text-transform:uppercase; letter-spacing:.04em }
    .tm-scope-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px }
    .tm-scope-chk-label { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:8px; border:1.5px solid var(--tm-border); cursor:pointer; font-size:12px; color:var(--tm-text) }
    .tm-manage-quota { width:90px; padding:6px 9px; border-radius:8px; border:1.5px solid var(--tm-border); background:transparent; color:var(--tm-text); font-size:13px; font-family:inherit }
    .tm-manage-save { padding:7px 14px; border-radius:9px; border:1.5px solid #7c5cff; background:#7c5cff; color:#fff; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit }
    .tm-manage-save:disabled { opacity:.5; cursor:default }

    /* -- Remove-from-team button -- */
    .tm-card-del { position:absolute; top:8px; left:8px; width:22px; height:22px; border-radius:50%; border:1px solid var(--tm-border); background:var(--tm-card); color:var(--tm-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; line-height:1; padding:0; z-index:2 }
    .tm-card-del:hover { background:rgba(239,68,68,.15); color:#dc2626; border-color:rgba(239,68,68,.4) }
    .tm-row-del { width:20px; height:20px; border-radius:50%; border:1px solid var(--tm-border); background:transparent; color:var(--tm-muted); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:13px; line-height:1; padding:0; margin-left:8px; flex-shrink:0 }
    .tm-row-del:hover { background:rgba(239,68,68,.15); color:#dc2626; border-color:rgba(239,68,68,.4) }
    .tm-row-last { display:flex; align-items:center; justify-content:flex-end }

    /* -- Add/Edit Normal User modal -- */
    .au-backdrop { position:fixed; inset:0; z-index:1100; background:rgba(0,0,0,.45); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity .2s }
    .au-backdrop.au-open { opacity:1; pointer-events:auto }
    .au-box { background:var(--tm-card); border-radius:18px; border:1px solid var(--tm-border); box-shadow:0 24px 60px rgba(0,0,0,.25); width:100%; max-width:380px; padding:20px; transform:translateY(16px) scale(.97); transition:transform .2s, opacity .2s; opacity:0 }
    .au-backdrop.au-open .au-box { transform:translateY(0) scale(1); opacity:1 }
    .au-title { font-size:15px; font-weight:800; color:var(--tm-text); margin-bottom:14px }
    .au-field { margin-bottom:12px }
    .au-label { font-size:11px; font-weight:700; color:var(--tm-muted); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:5px }
    .au-input { width:100%; box-sizing:border-box; padding:8px 11px; border-radius:9px; border:1.5px solid var(--tm-border); background:transparent; color:var(--tm-text); font-size:13px; font-family:inherit; outline:none }
    .au-input:focus { border-color:#7c5cff }
    .au-footer { display:flex; justify-content:flex-end; gap:8px; margin-top:16px }
    .au-btn { padding:8px 16px; border-radius:9px; border:1.5px solid var(--tm-border); background:transparent; color:var(--tm-text); font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit }
    .au-btn-save { border-color:#7c5cff; background:#7c5cff; color:#fff }
    .au-btn-save:disabled { opacity:.5; cursor:default }
    .tm-view-btn {
      width:34px; height:34px; border-radius:9px; border:1px solid var(--tm-border);
      background:transparent; color:var(--tm-muted); cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:.15s;
    }
    .tm-view-btn:hover { background:rgba(124,92,255,.08); color:#7c5cff; border-color:rgba(124,92,255,.3) }
    .tm-view-btn.active { background:rgba(124,92,255,.12); color:#7c5cff; border-color:rgba(124,92,255,.35) }

    /* -- List view -- */
    .tm-list { display:flex; flex-direction:column; gap:0 }

    /* Header row */
    .tm-list-header {
      display:grid;
      grid-template-columns: 40px 1fr 90px 64px 64px 104px 130px;
      align-items:center; padding:7px 14px 7px 10px;
      font-size:9.5px; font-weight:800; color:var(--tm-muted);
      text-transform:uppercase; letter-spacing:.07em;
      border-bottom:1px solid var(--tm-border); margin-bottom:6px;
    }
    .tm-list-header > span { text-align:center }
    .tm-list-header > span:nth-child(2) { text-align:left }
    .tm-list-header > span:last-child   { text-align:right }

    .tm-row {
      background:var(--tm-card); border-radius:12px; border:1px solid var(--tm-border);
      box-shadow:var(--tm-shadow); padding:9px 14px 9px 10px;
      display:grid;
      grid-template-columns: 40px 1fr 90px 64px 64px 104px 130px;
      align-items:center; gap:0;
      cursor:pointer; transition:.15s; margin-bottom:5px;
    }
    .tm-row:hover { border-color:rgba(124,92,255,.35); box-shadow:0 4px 18px rgba(124,92,255,.1) }
    .tm-row:active { opacity:.88 }

    /* Col 1 – avatar */
    .tm-row-av-wrap { position:relative; width:40px; display:flex; align-items:center; justify-content:center; flex-shrink:0 }
    .tm-row-av {
      width:38px; height:38px; border-radius:50%; overflow:hidden;
      border:2px solid rgba(124,92,255,.2); background:rgba(124,92,255,.1);
      display:flex; align-items:center; justify-content:center;
      font-size:15px; font-weight:800; color:#7c5cff;
    }
    .tm-row-av img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block }
    .tm-row-dot { position:absolute; bottom:0; right:2px; width:11px; height:11px; border-radius:50%; border:2px solid var(--tm-card) }
    .tm-row-dot.online  { background:#22c55e }
    .tm-row-dot.offline { background:#94a3b8 }

    /* Col 2 – name */
    .tm-row-info { min-width:0; padding:0 10px 0 8px }
    .tm-row-name { font-size:13px; font-weight:800; color:var(--tm-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px }
    .tm-row-uname { font-size:10px; color:var(--tm-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }

    /* Col 3 – role */
    .tm-row-role-col { display:flex; justify-content:center }

    /* Col 4 & 5 – stats */
    .tm-row-stat { display:flex; flex-direction:column; align-items:center; gap:1px }
    .tm-row-stat-val { font-size:15px; font-weight:800; color:var(--tm-text); font-variant-numeric:tabular-nums; line-height:1 }
    .tm-row-stat-lbl { font-size:8.5px; font-weight:700; color:var(--tm-muted); text-transform:uppercase; letter-spacing:.04em }

    /* Col 6 – online/offline + duration */
    .tm-live-col { display:flex; flex-direction:column; align-items:center; gap:2px }
    .tm-live { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; white-space:nowrap }
    .tm-live-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0 }
    .tm-live-on  { color:#16a34a }
    .tm-live-on  .tm-live-dot { background:#22c55e; animation:tmPulse 1.8s ease-in-out infinite }
    .tm-live-off { color:var(--tm-muted) }
    .tm-live-off .tm-live-dot { background:#94a3b8 }
    .tm-live-sub { font-size:9px; color:var(--tm-muted); white-space:nowrap }

    /* Col 7 – last active */
    .tm-row-last { font-size:10.5px; color:var(--tm-muted); white-space:nowrap; text-align:right }

    /* Narrow: drop Last Active but keep Status — it is the more useful of the two here. */
    @media(max-width:700px){
      .tm-list-header,
      .tm-row { grid-template-columns: 40px 1fr 78px 54px 54px 96px }
      .tm-row-last { display:none }
      .tm-list-header > span:last-child { display:none }
    }
    /* Phone: keep avatar / member / role / status only. Added(4) and Edited(5) go too — Last
       Active is already hidden by the rule above, which still applies at this width. */
    @media(max-width:460px){
      .tm-list-header,
      .tm-row { grid-template-columns: 40px 1fr 70px 92px }
      .tm-row > *:nth-child(4),
      .tm-row > *:nth-child(5) { display:none }
      .tm-list-header > span:nth-child(4),
      .tm-list-header > span:nth-child(5) { display:none }
    }

    /* ------------------------------
       PROFILE MODAL
    ------------------------------ */
    .pm-backdrop { position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,.45); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity .2s }
    .pm-backdrop.pm-open { opacity:1; pointer-events:auto }
    .pm-box { background:var(--tm-card); border-radius:24px; border:1px solid var(--tm-border); box-shadow:0 24px 60px rgba(0,0,0,.25); width:100%; max-width:360px; position:relative; overflow:hidden; transform:translateY(20px) scale(.97); transition:transform .22s, opacity .22s; opacity:0 }
    .pm-backdrop.pm-open .pm-box { transform:translateY(0) scale(1); opacity:1 }
    .pm-header { background:linear-gradient(135deg,rgba(124,92,255,.18) 0%,rgba(99,102,241,.08) 100%); padding:32px 24px 20px; display:flex; flex-direction:column; align-items:center; gap:0; border-bottom:1px solid var(--tm-border) }
    .pm-close { position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; border:none; background:rgba(148,163,184,.15); color:var(--tm-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s }
    .pm-close:hover { background:rgba(239,68,68,.15); color:#dc2626 }
    .pm-av-wrap { position:relative; margin-bottom:14px }
    .pm-av { width:100px; height:100px; border-radius:50%; overflow:hidden; border:4px solid rgba(124,92,255,.25); background:rgba(124,92,255,.1); display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:800; color:#7c5cff; flex-shrink:0 }
    .pm-av img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block }
    .pm-status-dot { position:absolute; bottom:4px; right:4px; width:20px; height:20px; border-radius:50%; border:3px solid var(--tm-card) }
    .pm-status-dot.online  { background:#22c55e; animation:tmPulse 1.8s ease-in-out infinite }
    .pm-status-dot.offline { background:#94a3b8 }
    .pm-name { font-size:17px; font-weight:800; color:var(--tm-text); margin-bottom:6px; text-align:center }
    .pm-badges { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center }
    .pm-body { padding:20px 24px 24px; display:flex; flex-direction:column; gap:16px }
    .pm-stats { display:flex; gap:0; border:1px solid var(--tm-border); border-radius:14px; overflow:hidden }
    .pm-stat { flex:1; padding:14px 8px; text-align:center; background:rgba(124,92,255,.04) }
    .pm-stat + .pm-stat { border-left:1px solid var(--tm-border) }
    .pm-stat-val { font-size:22px; font-weight:800; color:#7c5cff; line-height:1; margin-bottom:4px; font-variant-numeric:tabular-nums }
    .pm-stat-lbl { font-size:9px; font-weight:700; color:var(--tm-muted); text-transform:uppercase; letter-spacing:.05em }
    .pm-info-row { display:flex; flex-direction:column; gap:10px }
    .pm-info-item { display:flex; align-items:center; justify-content:space-between; gap:8px }
    .pm-info-label { font-size:11px; font-weight:700; color:var(--tm-muted); text-transform:uppercase; letter-spacing:.05em }
    .pm-info-val { font-size:12.5px; font-weight:700; color:var(--tm-text) }
    .pm-status-dot-inline { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; flex-shrink:0 }
    .pm-status-active   { background:#10b981 }
    .pm-status-inactive { background:#94a3b8 }
    /* Message button */

    .pm-msg-btn:hover { opacity:.9 }

  </style>
</head>

<script src="../assets/js/layout.js?v=30"></script>
<script src="../assets/js/dashboard-layout.js?v=1"></script>

<script src="../assets/js/api.js?v=8"></script>
<script>
'use strict';

var _users    = [];
var _pmCurIdx = null;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function getMyUsername(){ try{ var a=JSON.parse(localStorage.getItem('appAuth')||'null'); return a?(a.u||''):''; }catch(e){return '';} }
function getMyRole(){ try{ var a=JSON.parse(localStorage.getItem('appAuth')||'null'); return a?(a.role||''):''; }catch(e){return '';} }
function getMyManagesTeams(){ try{ var a=JSON.parse(localStorage.getItem('appAuth')||'null'); return (a&&Array.isArray(a.manages_teams))?a.manages_teams:[]; }catch(e){return [];} }
/* '*' means "every Sub Admin team, current and future" — expand it against whatever Sub Admin
   rows team_list actually returned (already unrestricted server-side for a '*' grant). */
function getMyManagedSubAdminUsernames() {
  var mine = getMyManagesTeams();
  if (mine.indexOf('*') !== -1) {
    return _users.filter(function(u){ return u.role==='Sub Admin'; }).map(function(u){ return u.username; });
  }
  return mine;
}

/* Display order: me first, then active accounts, inactive last — matching User Management.
   Sorted IN PLACE, deliberately: the cards and rows pass their array index to openCard/
   openProfile, so rendering from a sorted copy while those read the unsorted _users would open
   the wrong person. Every other use of _users is find/filter, which does not care about order.
   Array.sort is stable, so the server's ordering survives within each group. */
function sortTeamMembers() {
  var me = getMyUsername();
  _users.sort(function(a, b) {
    var aMe = a.username === me ? 0 : 1;
    var bMe = b.username === me ? 0 : 1;
    if (aMe !== bMe) return aMe - bMe;
    var aOff = (a.status || 'active') === 'active' ? 0 : 1;
    var bOff = (b.status || 'active') === 'active' ? 0 : 1;
    return aOff - bOff;
  });
}

/* ── Sub Admin (own team) + Assistant (delegated teams): which team(s) may I add/see quota for ── */
function getManageableTeams() {
  var mine   = getMyUsername();
  var role   = getMyRole();
  var out    = [];
  if (role === 'Sub Admin') {
    var me = _users.find(function(u){ return u.username===mine; });
    out.push({ username: mine, label: (me&&me.team_name)||mine, quota: me?Number(me.max_normal_users||0):0 });
  }
  getMyManagedSubAdminUsernames().forEach(function(t){
    if (out.some(function(o){ return o.username===t; })) return;
    var row = _users.find(function(u){ return u.username===t && u.role==='Sub Admin'; });
    if (!row) return;
    out.push({ username: t, label: row.team_name||row.display_name||t, quota: Number(row.max_normal_users||0) });
  });
  out.forEach(function(t){ t.used = _users.filter(function(u){ return u.created_by===t.username; }).length; });
  return out;
}

/* ── Add Normal User toolbar (Sub Admin's own team, and/or any Assistant-managed team) ── */
function updateTeamToolbar() {
  var teams   = getManageableTeams();
  var quotaEl = document.getElementById('tmQuota');
  var btnEl   = document.getElementById('tmAddBtn');
  if (!teams.length) return;
  var used  = teams.reduce(function(s,t){ return s+t.used;  }, 0);
  var quota = teams.reduce(function(s,t){ return s+t.quota; }, 0);
  quotaEl.textContent = used+' / '+quota+' Normal Users created';
  quotaEl.style.display = '';
  btnEl.style.display = '';
  btnEl.disabled = teams.every(function(t){ return t.used >= t.quota; });
}
function openAddUserModal() {
  var teams = getManageableTeams();
  var teamField = document.getElementById('au_team_field');
  var teamSel   = document.getElementById('au_team');
  if (teams.length > 1) {
    teamField.style.display = '';
    teamSel.innerHTML = teams.map(function(t){
      var full = t.used >= t.quota;
      return '<option value="'+esc(t.username)+'"'+(full?' disabled':'')+'>'+esc(t.label)+' ('+t.used+'/'+t.quota+')'+(full?' — Full':'')+'</option>';
    }).join('');
  } else {
    teamField.style.display = 'none';
  }
  document.getElementById('auTitle').textContent = 'Add Normal User';
  document.getElementById('au_username').value = '';
  document.getElementById('au_username').readOnly = false;
  document.getElementById('au_display_name').value = '';
  document.getElementById('au_pin').value = '';
  document.getElementById('au_role').value = 'Staff Loan';
  document.getElementById('auBackdrop').classList.add('au-open');
  setTimeout(function(){ document.getElementById('au_username').focus(); }, 80);
}
function closeAddUserModal() {
  document.getElementById('auBackdrop').classList.remove('au-open');
}
async function saveNormalUser() {
  var username = document.getElementById('au_username').value.trim();
  var display_name = document.getElementById('au_display_name').value.trim();
  var pin = document.getElementById('au_pin').value.trim();
  var role = document.getElementById('au_role').value;
  if (!username) return toast('Please enter a Username');
  if (!display_name) return toast('Please enter a Display Name');
  if (!pin) return toast('Please enter a PIN');
  var teams = getManageableTeams();
  var team  = teams.length > 1 ? document.getElementById('au_team').value : (teams[0] && teams[0].username);
  var btn = document.getElementById('auSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    var res = await CamboAPI.post({ action:'user_add', username:username, display_name:display_name, pin:pin, role:role, status:'active', team:team });
    if (res && res.ok) {
      toast('User added!');
      closeAddUserModal();
      location.reload();
    } else {
      toast((res&&res.message)||'Failed to add user', true);
    }
  } catch(e) { toast('Network error', true); }
  btn.disabled = false; btn.textContent = 'Save';
}

/* ── Remove a Normal User from the team (Sub Admin over their own creations, Assistant over a
     managed team's creations). Team leads (Sub Admin accounts) can't be removed from here. ── */
function canManageMember(u) {
  if (u.username === getMyUsername() || u.role === 'Sub Admin') return false;
  if (getMyRole() === 'Sub Admin' && u.created_by === getMyUsername()) return true;
  return getMyManagedSubAdminUsernames().indexOf(u.created_by) !== -1;
}
async function requestDeleteMember(username) {
  var u = _users.find(function(x){ return x.username===username; });
  if (!u) return;
  if (!confirm('Remove "'+(u.display_name||u.username)+'" from the team? This cannot be undone.')) return;
  try {
    var res = await CamboAPI.post({ action:'user_delete', username: username });
    if (res && res.ok) { toast('User removed'); location.reload(); }
    else toast((res&&res.message)||'Failed to remove user', true);
  } catch(e) { toast('Network error', true); }
}

/* ── Assistant "Manage Teams" panel: rename / scope / quota for each delegated Sub Admin team ── */
var _allLinkedTo = [];
async function loadLinkedToForManage() {
  try {
    var res = await CamboAPI.post({ action:'get_all' });
    if (res && res.ok) _allLinkedTo = (res.linkedTo||[]).filter(function(v){ return v && v.toLowerCase()!=='linked to'; });
  } catch(e) {}
}
/* ── Show/hide the whole Teams You Manage panel. Even collapsed to one line per team it is a
     lot of screen for someone who is only here to look at members, so the button lets them
     tuck it away. Remembered per browser so the choice survives a reload. ── */
var _MG_HIDE_KEY = 'tm_manage_hidden';
var _SVG_EYE     = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var _SVG_EYE_OFF = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

function _isManagePanelHidden() {
  try { return localStorage.getItem(_MG_HIDE_KEY) === '1'; } catch(e) { return false; }
}
function _paintManagePanel(hidden) {
  var panel = document.getElementById('tmManagePanel');
  var btn   = document.getElementById('tmPanelToggle');
  /* Only meaningful when there is a panel to hide — an assistant with managed teams. */
  var hasPanel = panel && panel.innerHTML.trim() !== '';
  if (btn) btn.style.display = hasPanel ? '' : 'none';
  if (!hasPanel) return;
  panel.style.display = hidden ? 'none' : '';
  if (btn) {
    btn.innerHTML = hidden ? _SVG_EYE_OFF : _SVG_EYE;
    btn.title = hidden ? 'Show the teams you manage' : 'Hide the teams you manage';
    btn.classList.toggle('active', !hidden);
  }
}
function toggleManagePanel() {
  var hidden = !_isManagePanelHidden();
  try { localStorage.setItem(_MG_HIDE_KEY, hidden ? '1' : '0'); } catch(e) {}
  _paintManagePanel(hidden);
}

/* The panel used to render every managed team fully expanded. An assistant holding the '*'
   grant manages every team, so that meant one long editor per team — unusable once there are
   dozens. Now each team is a one-line summary and the editor is built only when you open it. */
function renderManageTeamsPanel() {
  var panel = document.getElementById('tmManagePanel');
  if (!panel) return;
  var rows = getMyManagedSubAdminUsernames()
    .map(function(t){ return _users.find(function(u){ return u.username===t && u.role==='Sub Admin'; }); })
    .filter(Boolean);
  if (!rows.length) { panel.style.display='none'; panel.innerHTML=''; return; }
  panel.style.display = '';
  var isAll = getMyManagesTeams().indexOf('*') !== -1;
  var title = 'Teams You Manage' + (isAll ? ' (All)' : '') + ' — ' + rows.length;
  panel.innerHTML = ''
    + '<div class="tm-manage-hdr">'
      + '<div class="tm-manage-title" style="margin:0">'+esc(title)+'</div>'
      + (rows.length > 5
          ? '<input class="tm-manage-search" id="tmTeamSearch" type="search" placeholder="Search team…" autocomplete="off" oninput="filterManageTeams()">'
          : '')
    + '</div>'
    + '<div id="tmManageRows">' + rows.map(renderManageRow).join('') + '</div>'
    + '<div class="tm-manage-nomatch" id="tmManageNoMatch" style="display:none">No team matches that search.</div>';
}

/* Collapsed one-liner. data-team-search carries name + username so the filter can match either. */
function renderManageRow(sa) {
  var name  = sa.team_name || sa.display_name || sa.username;
  var used  = _users.filter(function(u){ return u.created_by === sa.username; }).length;
  var scope = Array.isArray(sa.scope_linked_to) ? sa.scope_linked_to : [];
  var tags  = scope.length
    ? scope.map(function(v){ return '<span class="tm-mini-tag">'+esc(v)+'</span>'; }).join('')
    : '<span class="tm-mini-none">no scope</span>';
  return '<div class="tm-manage-card" data-username="'+esc(sa.username)+'" data-team-search="'+esc((name+' '+sa.username).toLowerCase())+'">'
    + '<div class="tm-manage-summary" onclick="toggleManageTeam(\''+esc(sa.username)+'\')">'
      + '<span class="tm-mini-caret" id="tmCaret_'+esc(sa.username)+'">&#9656;</span>'
      + '<span class="tm-mini-name">'+esc(name)+'</span>'
      + '<span class="tm-mini-user">@'+esc(sa.username)+'</span>'
      + '<span class="tm-mini-tags">'+tags+'</span>'
      + '<span class="tm-mini-quota">'+used+' / '+(sa.max_normal_users||0)+'</span>'
    + '</div>'
    + '<div class="tm-manage-body" id="tmBody_'+esc(sa.username)+'" style="display:none"></div>'
  + '</div>';
}

/* Built on first open and then kept, so collapsing and reopening never discards an unsaved edit. */
function toggleManageTeam(username) {
  var body  = document.getElementById('tmBody_'+username);
  var caret = document.getElementById('tmCaret_'+username);
  if (!body) return;
  var open = body.style.display !== 'none';
  if (open) { body.style.display = 'none'; if (caret) caret.innerHTML = '&#9656;'; return; }
  if (!body.innerHTML) {
    var sa = _users.find(function(u){ return u.username===username; }) || {};
    body.innerHTML = renderManageEditor(sa);
  }
  body.style.display = '';
  if (caret) caret.innerHTML = '&#9662;';
}

function renderManageEditor(sa) {
  var scopeHtml = _allLinkedTo.length
    ? _allLinkedTo.map(function(v){
        var isChecked = Array.isArray(sa.scope_linked_to) && sa.scope_linked_to.indexOf(v)!==-1;
        return '<label class="tm-scope-chk-label"><input type="checkbox" class="tm_scope_chk_'+esc(sa.username)+'" value="'+esc(v)+'"'+(isChecked?' checked':'')+'> '+esc(v)+'</label>';
      }).join('')
    : '<span class="tm-manage-label" style="text-transform:none">No "Linked To" entries defined yet.</span>';
  return ''
    + '<div class="tm-manage-head">'
      + '<input class="tm-manage-name-input" id="tmTeamName_'+esc(sa.username)+'" value="'+esc(sa.team_name||sa.display_name||sa.username)+'" placeholder="Team name">'
    + '</div>'
    + '<div class="tm-manage-row"><span class="tm-manage-label">Linked To Scope</span></div>'
    + '<div class="tm-scope-tags">'+scopeHtml+'</div>'
    + '<div class="tm-manage-row">'
      + '<span class="tm-manage-label">Max Normal Users</span>'
      + '<input class="tm-manage-quota" id="tmQuota_'+esc(sa.username)+'" type="number" min="0" step="1" value="'+(sa.max_normal_users||0)+'">'
      + '<button class="tm-manage-save" id="tmManageSaveBtn_'+esc(sa.username)+'" onclick="saveManageTeam(\''+esc(sa.username)+'\')">Save Changes</button>'
    + '</div>';
}

/* Filters by hiding rows rather than re-rendering, so a team you have open with unsaved edits
   keeps its DOM (and those edits) even while you search. */
function filterManageTeams() {
  var input = document.getElementById('tmTeamSearch');
  var wrap  = document.getElementById('tmManageRows');
  if (!input || !wrap) return;
  var q = input.value.trim().toLowerCase();
  var cards = wrap.querySelectorAll('.tm-manage-card[data-team-search]');
  var shown = 0;
  Array.prototype.forEach.call(cards, function(c){
    var match = !q || c.getAttribute('data-team-search').indexOf(q) !== -1;
    c.style.display = match ? '' : 'none';
    if (match) shown++;
  });
  var nm = document.getElementById('tmManageNoMatch');
  if (nm) nm.style.display = (cards.length && !shown) ? '' : 'none';
}
async function saveManageTeam(username) {
  var saRow    = _users.find(function(u){ return u.username===username; }) || {};
  var teamName = document.getElementById('tmTeamName_'+username).value.trim();
  var quota    = parseInt(document.getElementById('tmQuota_'+username).value)||0;
  var scope    = Array.from(document.querySelectorAll('.tm_scope_chk_'+username+':checked')).map(function(el){ return el.value; });
  var btn = document.getElementById('tmManageSaveBtn_'+username);
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    var r1 = await CamboAPI.post({ action:'user_set_team_name', username: username, team_name: teamName });
    var r2 = await CamboAPI.post({
      action:'user_update', username: username, display_name: saRow.display_name||username,
      role:'Sub Admin', status: saRow.status||'active',
      exp_date: saRow.exp_date ? String(saRow.exp_date).substring(0,10) : null,
      scope_linked_to: scope, max_normal_users: quota
    });
    if ((r1&&r1.ok) && (r2&&r2.ok)) { toast('Team updated!'); location.reload(); }
    else { toast(((r1&&r1.message)||(r2&&r2.message))||'Failed to save', true); btn.disabled=false; btn.textContent='Save Changes'; }
  } catch(e) { toast('Network error', true); btn.disabled=false; btn.textContent='Save Changes'; }
}
function toast(msg, isErr) {
  var el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:'+(isErr?'#ef4444':'#16a34a')+';color:#fff;padding:10px 18px;border-radius:10px;font-size:12.5px;font-weight:700;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.25)';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2200);
}

function isOnline(dtStr) {
  if (!dtStr) return false;
  try {
    var s = String(dtStr).trim().replace(' ','T');
    if (!/Z$|[+-]\d{2}:\d{2}$/.test(s)) s += 'Z';
    var ms = new Date(s).getTime();
    return !isNaN(ms) && (Date.now()-ms) < 10*60*1000;
  } catch(e){ return false; }
}

function fmtLastActive(dtStr) {
  if (!dtStr) return 'Never';
  try {
    var s = String(dtStr).trim().replace(' ','T');
    if (!/Z$|[+-]\d{2}:\d{2}$/.test(s)) s += 'Z';
    var d = new Date(s); if (isNaN(d.getTime())) return '—';
    var TZ='Asia/Phnom_Penh';
    var parts=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(d);
    var p={}; parts.forEach(function(x){p[x.type]=x.value;});
    var h24=parseInt(p.hour,10),ampm=h24>=12?'PM':'AM',h12=h24%12||12;
    var ppDate=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d);
    var nowDate=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
    var dp=(ppDate===nowDate)?'Today':p.day+'/'+p.month+'/'+p.year.slice(2);
    return dp+' '+String(h12).padStart(2,'0')+':'+p.minute+' '+ampm;
  } catch(e){ return '—'; }
}

function fmtExpiry(expDate) {
  if (!expDate) return '—';
  var ms=new Date(String(expDate)+'T23:59:59').getTime();
  var d=Math.ceil((ms-Date.now())/86400000);
  var parts=String(expDate).split('-');
  var label=parts.length===3?parts[2]+'/'+parts[1]+'/'+parts[0]:expDate;
  if (d<=0)  return label+' <span style="color:#dc2626;font-size:10px">(Expired)</span>';
  if (d<=7)  return label+' <span style="color:#d97706;font-size:10px">('+d+' days)</span>';
  return label+' <span style="color:#059669;font-size:10px">('+d+' days)</span>';
}

function expBadge(expDate) {
  if (!expDate) return '';
  var ms=new Date(String(expDate)+'T23:59:59').getTime();
  var d=Math.ceil((ms-Date.now())/86400000);
  if (d<=0) return '<span class="tm-exp tm-exp-red">Expired</span>';
  if (d<=7) return '<span class="tm-exp tm-exp-warn">'+d+' days</span>';
  return '<span class="tm-exp tm-exp-ok">'+d+' days</span>';
}

function roleCls(role) {
  var r=(role||'').toLowerCase();
  if (r.indexOf('admin')!==-1) return 'tm-role-admin';
  if (r.indexOf('owner')!==-1) return 'tm-role-owner';
  return 'tm-role-staff';
}

function renderCard(u, idx) {
  var name=u.display_name||u.username||'?';
  var init=name.charAt(0).toUpperCase();
  var photo=u.photo_url||'';
  var avInner=photo
    ?'<img src="'+esc(photo)+'" alt="'+esc(init)+'" onerror="this.parentNode.innerHTML=\''+esc(init)+'\'">'
    :esc(init);
  var online=isOnline(u.last_seen);
  return '<div class="tm-card" data-username="'+esc(u.username)+'" onclick="openCard('+idx+')">'
    +(canManageMember(u)?'<button class="tm-card-del" title="Remove from team" onclick="event.stopPropagation();requestDeleteMember(\''+esc(u.username)+'\')">&times;</button>':'')
    +'<div class="tm-av-wrap">'
      +'<div class="tm-av">'+avInner+'</div>'
      +'<span class="tm-status-dot '+(online?'online':'offline')+'" title="'+(online?'Online':'Offline')+'"></span>'
    +'</div>'
    +'<div class="tm-name">'+esc(name)+'</div>'
    +'<span class="tm-role '+roleCls(u.role)+'">'+esc(u.role||'Staff')+'</span>'
    +'<div class="tm-divider"></div>'
    +'<div class="tm-stats">'
      +'<div class="tm-stat"><div class="tm-stat-val">'+Number(u.loans_added||0)+'</div><div class="tm-stat-lbl">Added</div></div>'
      +'<div class="tm-stat"><div class="tm-stat-val">'+Number(u.loans_edited||0)+'</div><div class="tm-stat-lbl">Edited</div></div>'
    +'</div>'
    +'<div class="tm-divider"></div>'
    +'<div class="tm-last">Last login: '+fmtLastActive(u.last_login||'')+'</div>'
    +'</div>';
}

function openCard(idx) {
  var u = _users[idx];
  if (!u) return;
  if (u.username === getMyUsername()) {
    openProfile(idx); // own card ? profile
  } else {
    openProfile(idx); // show profile first, user clicks Message to chat
  }
}

/* -- Profile Modal -- */
function openProfile(idx) {
  var u = _users[idx]; if (!u) return;
  _pmCurIdx = idx;
  var name=u.display_name||u.username||'?';
  var init=name.charAt(0).toUpperCase();
  var photo=u.photo_url||'';
  var avEl=document.getElementById('pmAv');
  avEl.innerHTML=photo?'<img src="'+esc(photo)+'" alt="'+esc(init)+'" onerror="this.parentNode.innerHTML=\''+esc(init)+'\'">'  :esc(init);
  document.getElementById('pmName').textContent=name;
  var dotEl=document.getElementById('pmStatusDot');
  dotEl.className='pm-status-dot '+(isOnline(u.last_seen)?'online':'offline');
  dotEl.title=isOnline(u.last_seen)?'Online':'Offline';
  var rc=roleCls(u.role);
  document.getElementById('pmBadges').innerHTML='<span class="tm-role '+rc+'">'+esc(u.role||'Staff')+'</span>'+expBadge(u.exp_date);
  document.getElementById('pmAdded').textContent=Number(u.loans_added||0);
  document.getElementById('pmEdited').textContent=Number(u.loans_edited||0);
  var isActive=(u.status||'active')==='active';
  document.getElementById('pmStatus').innerHTML='<span class="pm-status-dot-inline '+(isActive?'pm-status-active':'pm-status-inactive')+'"></span>'+(isActive?'Active':'Inactive');
  document.getElementById('pmExpires').innerHTML=fmtExpiry(u.exp_date);
  document.getElementById('pmLastLogin').textContent=fmtLastActive(u.last_login||'');
  var msgBtn=document.getElementById('pmMsgBtn');
  msgBtn.style.display=(u.username===getMyUsername())?'none':'flex';
  document.getElementById('pmBackdrop').classList.add('pm-open');
  document.body.style.overflow='hidden';
}

function closeProfile() {
  document.getElementById('pmBackdrop').classList.remove('pm-open');
  document.body.style.overflow='';
}

function handlePmBdClick(e) { if(e.target===document.getElementById('pmBackdrop')) closeProfile(); }

function openChatFromProfile() {
  if (_pmCurIdx==null) return;
  var u=_users[_pmCurIdx]; if (!u) return;
  closeProfile();
  setTimeout(function(){
    if (window.openGlobalChat) window.openGlobalChat(u.username, u.display_name||u.username, u.photo_url||'', isOnline(u.last_seen));
  }, 200);
}

/* Update unread badges when global chat widget broadcasts */
document.addEventListener('app-unread-update', function(e) {
  var counts=(e.detail&&e.detail.counts)||{};
  document.querySelectorAll('.tm-card, .tm-row').forEach(function(card){
    var uname=card.getAttribute('data-username')||'';
    var old=card.querySelector('.tm-unread'); if(old) old.remove();
    var cnt=counts[uname]||0;
    if (cnt>0){
      var b=document.createElement('div');
      b.className='tm-unread'; b.textContent=cnt>9?'9+':String(cnt);
      card.appendChild(b);
    }
  });
});

document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeProfile(); });

function listHeader() {
  return '<div class="tm-list-header">'
    +'<span></span>'
    +'<span>MEMBER</span>'
    +'<span>ROLE</span>'
    +'<span>ADDED</span>'
    +'<span>EDITED</span>'
    +'<span>STATUS</span>'
    +'<span>LAST ACTIVE</span>'
    +'</div>';
}

/* Whole minutes since a timestamp, or null when it is missing/unparseable.
   Same UTC-suffix handling as isOnline/fmtLastActive — the server sends naive datetimes. */
function minsSince(dtStr) {
  if (!dtStr) return null;
  try {
    var s = String(dtStr).trim().replace(' ', 'T');
    if (!/Z$|[+-]\d{2}:\d{2}$/.test(s)) s += 'Z';
    var ms = new Date(s).getTime();
    if (isNaN(ms)) return null;
    return Math.max(0, Math.floor((Date.now() - ms) / 60000));
  } catch(e) { return null; }
}
function durText(mins) {
  if (mins == null) return '';
  if (mins < 1)  return 'just now';
  if (mins < 60) return mins + ' min';
  var h = Math.floor(mins / 60);
  if (h < 24)    return h + ' hr';
  var d = Math.floor(h / 24);
  return d + ' day' + (d > 1 ? 's' : '');
}

/* Online/Offline plus how long. The two durations mean different things, so they are worded
   differently: online shows the current session ("for 25 min", measured from their last login),
   offline shows how long they have been away ("3 hr ago", measured from last_seen). */
function statusCell(u) {
  var online = isOnline(u.last_seen);
  var mins   = online ? minsSince(u.last_login) : minsSince(u.last_seen);
  var sub    = '';
  if (mins != null) {
    if (online) sub = mins < 1 ? 'just signed in' : 'for ' + durText(mins);
    else        sub = durText(mins) + (mins < 1 ? '' : ' ago');
  }
  return '<div class="tm-live-col">'
    + '<span class="tm-live '+(online ? 'tm-live-on' : 'tm-live-off')+'"><span class="tm-live-dot"></span>'+(online ? 'Online' : 'Offline')+'</span>'
    + (sub ? '<span class="tm-live-sub">'+esc(sub)+'</span>' : '')
    + '</div>';
}

function renderRow(u, idx) {
  var name=u.display_name||u.username||'?';
  var init=name.charAt(0).toUpperCase();
  var photo=u.photo_url||'';
  var avInner=photo
    ?'<img src="'+esc(photo)+'" alt="'+esc(init)+'" onerror="this.parentNode.innerHTML=\''+esc(init)+'\'">'
    :esc(init);
  var online=isOnline(u.last_seen);
  var rc=roleCls(u.role);
  return '<div class="tm-row" data-username="'+esc(u.username)+'" onclick="openCard('+idx+')">'
    +'<div class="tm-row-av-wrap">'
      +'<div class="tm-row-av">'+avInner+'</div>'
      +'<span class="tm-row-dot '+(online?'online':'offline')+'" title="'+(online?'Online':'Offline')+'"></span>'
    +'</div>'
    +'<div class="tm-row-info">'
      +'<div class="tm-row-name">'+esc(name)+'</div>'
      +'<div class="tm-row-uname">'+esc(u.username||'')+(expBadge(u.exp_date)?'&nbsp;·&nbsp;'+expBadge(u.exp_date):'')+'</div>'
    +'</div>'
    +'<div class="tm-row-role-col"><span class="tm-role '+rc+'">'+esc(u.role||'Staff')+'</span></div>'
    +'<div class="tm-row-stat"><div class="tm-row-stat-val">'+Number(u.loans_added||0)+'</div><div class="tm-row-stat-lbl">Added</div></div>'
    +'<div class="tm-row-stat"><div class="tm-row-stat-val">'+Number(u.loans_edited||0)+'</div><div class="tm-row-stat-lbl">Edited</div></div>'
    +statusCell(u)
    +'<div class="tm-row-last">'+esc(fmtLastActive(u.last_login||''))+(canManageMember(u)?'<button class="tm-row-del" title="Remove from team" onclick="event.stopPropagation();requestDeleteMember(\''+esc(u.username)+'\')">&times;</button>':'')+'</div>'
    +'</div>';
}

var _curView = localStorage.getItem('tm_view') || 'grid';

function setView(mode) {
  _curView = mode;
  localStorage.setItem('tm_view', mode);
  var gridEl=document.getElementById('tmGrid');
  var listEl=document.getElementById('tmList');
  var btnG=document.getElementById('btnGrid');
  var btnL=document.getElementById('btnList');
  if (mode === 'list') {
    gridEl.style.display='none'; listEl.style.display='';
    btnG.classList.remove('active'); btnL.classList.add('active');
    if (!listEl.innerHTML) listEl.innerHTML=listHeader()+_users.map(renderRow).join('');
  } else {
    listEl.style.display='none'; gridEl.style.display='';
    btnG.classList.add('active'); btnL.classList.remove('active');
  }
}

/* -- Load -- */
document.addEventListener('DOMContentLoaded', async function() {
  if (window.CamcvcAuth&&!window.CamcvcAuth.check()) return;
  try {
    var res=await CamboAPI.post({ action:'team_list' });
    var stateEl=document.getElementById('tmState');
    if (!res||!res.ok){ stateEl.textContent=(res&&res.message)||'Error loading team'; return; }
    if (!res.users||!res.users.length){ stateEl.textContent='No team members found'; return; }
    _users=res.users;
    sortTeamMembers();
    if (getMyManagesTeams().length) { await loadLinkedToForManage(); renderManageTeamsPanel(); }
    /* after the render, which sets display itself, so the remembered choice wins */
    _paintManagePanel(_isManagePanelHidden());
    var gridEl=document.getElementById('tmGrid');
    var listEl=document.getElementById('tmList');
    gridEl.innerHTML=_users.map(renderCard).join('');
    listEl.innerHTML=listHeader()+_users.map(renderRow).join('');
    stateEl.style.display='none';
    document.getElementById('tmToolbar').style.display='';
    updateTeamToolbar();
    setView(_curView);
  } catch(e){ document.getElementById('tmState').textContent='Error loading team'; }
});
</script>
