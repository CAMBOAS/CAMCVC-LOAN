<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sign In — CAMCVC LOAN</title>
  <link rel="icon" type="image/png" href="images/logo/LOGO.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ── */
    :root {
      --accent:  #7c5cff;
      --accent2: #06b6d4;
      --err:     #ef4444;
    }

    /* ── Light ── */
    html[data-theme="light"] {
      --bg-from: #ede9fe;
      --bg-to:   #e0f2fe;
      --card:    #ffffff;
      --card-border: rgba(124,92,255,.14);
      --text:    #0f172a;
      --muted:   #64748b;
      --inp-bg:  #f8fafc;
      --inp-border: rgba(148,163,184,.28);
      --inp-focus-bg: rgba(124,92,255,.06);
      --inp-focus-ring: rgba(124,92,255,.18);
      --shadow:  0 24px 64px rgba(99,102,241,.18), 0 4px 20px rgba(0,0,0,.07);
      --blob1:   rgba(124,92,255,.14);
      --blob2:   rgba(6,182,212,.12);
      --divider: rgba(148,163,184,.3);
    }

    /* ── Dark ── */
    html[data-theme="dark"] {
      --bg-from: #07091a;
      --bg-to:   #060d18;
      --card:    rgba(14,18,40,.93);
      --card-border: rgba(124,92,255,.22);
      --text:    #f1f5f9;
      --muted:   #94a3b8;
      --inp-bg:  rgba(255,255,255,.05);
      --inp-border: rgba(148,163,184,.16);
      --inp-focus-bg: rgba(124,92,255,.1);
      --inp-focus-ring: rgba(124,92,255,.22);
      --shadow:  0 24px 64px rgba(0,0,0,.55), 0 0 0 1px rgba(124,92,255,.18);
      --blob1:   rgba(124,92,255,.22);
      --blob2:   rgba(6,182,212,.18);
      --divider: rgba(148,163,184,.14);
    }

    /* ── Base ── */
    html, body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(145deg, var(--bg-from) 0%, var(--bg-to) 100%);
    }

    /* ── Decorative blobs ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      pointer-events: none;
      animation: blobDrift 18s ease-in-out infinite alternate;
    }
    .blob-1 {
      width: 520px; height: 520px;
      background: var(--blob1);
      top: -160px; left: -120px;
      animation-delay: 0s;
    }
    .blob-2 {
      width: 420px; height: 420px;
      background: var(--blob2);
      bottom: -100px; right: -80px;
      animation-delay: -7s;
    }
    @keyframes blobDrift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px,20px) scale(1.06); }
    }

    /* ── Wrap ── */
    .wrap {
      width: 100%;
      max-width: 420px;
      padding: 20px 16px calc(24px + env(safe-area-inset-bottom,0px));
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: 28px;
      padding: 40px 36px 36px;
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
      position: relative;
      overflow: hidden;
      animation: cardUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    html[data-theme="dark"] .card {
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
    }

    /* Top gradient stripe */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
      border-radius: 28px 28px 0 0;
    }

    @keyframes cardUp {
      from { opacity: 0; transform: translateY(28px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── Logo area ── */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .logo-ring {
      width: 82px; height: 82px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, rgba(124,92,255,.12), rgba(6,182,212,.08));
      position: relative;
      animation: logoFloat 7s ease-in-out infinite;
    }

    /* Spinning gradient border */
    .logo-ring::after {
      content: '';
      position: absolute;
      inset: -2px;
      padding: 2px;
      border-radius: 26px;
      background: conic-gradient(from 0deg, var(--accent), var(--accent2), rgba(124,92,255,0) 50%, var(--accent));
      animation: spinBorder 2.5s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @keyframes spinBorder {
      to { transform: rotate(360deg); }
    }

    /* 8-phase logo animation */
    @keyframes logoFloat {
      0%    { transform: scale(1) translateY(0) rotate(0deg);
              box-shadow: 0 0 32px rgba(124,92,255,.25), 0 4px 16px rgba(0,0,0,.08); }
      12.5% { transform: scale(1.07) translateY(-7px) rotate(0deg);
              box-shadow: 0 0 58px rgba(124,92,255,.58), 0 14px 32px rgba(0,0,0,.13); }
      25%   { transform: scale(1.03) translateY(-4px) rotate(10deg);
              box-shadow: 0 0 46px rgba(6,182,212,.48), 0 10px 22px rgba(0,0,0,.1); }
      37.5% { transform: scale(1.12) translateY(-10px) rotate(0deg);
              box-shadow: 0 0 76px rgba(124,92,255,.72), 0 20px 44px rgba(0,0,0,.17); }
      50%   { transform: scale(0.95) translateY(5px) rotate(-7deg);
              box-shadow: 0 0 14px rgba(124,92,255,.1), 0 2px 8px rgba(0,0,0,.05); }
      62.5% { transform: scale(1.07) translateY(-5px) rotate(0deg);
              box-shadow: 0 0 52px rgba(124,92,255,.52), 0 12px 28px rgba(0,0,0,.12); }
      75%   { transform: scale(1.02) translateY(-2px) rotate(-7deg);
              box-shadow: 0 0 42px rgba(6,182,212,.4), 0 8px 18px rgba(0,0,0,.09); }
      87.5% { transform: scale(1.01) translateY(-1px) rotate(0deg);
              box-shadow: 0 0 36px rgba(124,92,255,.3), 0 5px 14px rgba(0,0,0,.08); }
      100%  { transform: scale(1) translateY(0) rotate(0deg);
              box-shadow: 0 0 32px rgba(124,92,255,.25), 0 4px 16px rgba(0,0,0,.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-ring { animation: none; box-shadow: 0 0 32px rgba(124,92,255,.2), 0 4px 16px rgba(0,0,0,.08); border: 1.5px solid rgba(124,92,255,.28); }
      .logo-ring::after { animation: none; display: none; }
    }

    .logo-img {
      width: 54px; height: 54px;
      object-fit: contain;
      border-radius: 14px;
    }

    .logo-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: .06em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-top: 2px;
    }

    .logo-sub {
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
      margin-top: -4px;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      font-size: 10.5px;
      color: var(--muted);
      opacity: .65;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--divider);
    }

    /* ── Fields ── */
    .field { margin-bottom: 18px; }

    .field label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .field label svg { opacity: .7; }

    .field-inner { position: relative; }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      opacity: .55;
      pointer-events: none;
      line-height: 0;
    }

    .field input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      background: var(--inp-bg);
      border: 1.5px solid var(--inp-border);
      border-radius: 14px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .field input:focus {
      border-color: var(--accent);
      background: var(--inp-focus-bg);
      box-shadow: 0 0 0 4px var(--inp-focus-ring);
    }
    .field input::placeholder { color: var(--muted); opacity: .45; }

    /* PIN */
    .pin-wrap input { padding-right: 50px; letter-spacing: .2em; font-size: 18px; }

    .pin-eye {
      position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--muted);
      padding: 5px; line-height: 0; opacity: .55; transition: opacity .15s;
    }
    .pin-eye:hover { opacity: 1; }

    /* ── Error ── */
    .err-box {
      display: none;
      align-items: flex-start;
      gap: 9px;
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #ef4444;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .err-box svg { flex-shrink: 0; margin-top: 2px; }
    .err-content { display: flex; flex-direction: column; gap: 5px; }
    .err-admin {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }
    .admin-link {
      color: #22c55e;
      font-weight: 900;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      letter-spacing: .02em;
      transition: opacity .15s;
    }
    .admin-link:hover { opacity: .8; text-decoration: underline; }

    /* ── Button ── */
    .btn-login {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 15.5px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s, opacity .15s;
      box-shadow: 0 6px 24px rgba(124,92,255,.4);
      margin-top: 4px;
      position: relative;
      letter-spacing: .03em;
    }
    .btn-login:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(124,92,255,.5);
    }
    .btn-login:not(:disabled):active { transform: scale(.97); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    .spin {
      display: none;
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    /* ── Footer ── */
    /* ── Sign in by QR ── */
    .lq-or { display:flex; align-items:center; gap:10px; margin:16px 0 12px; color:#94a3b8; font-size:12px }
    .lq-or::before, .lq-or::after { content:''; flex:1; height:1px; background:rgba(148,163,184,.28) }
    .lq-scan-btn {
      width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
      padding:12px; border-radius:12px; cursor:pointer;
      border:1.5px solid rgba(99,102,241,.35); background:rgba(99,102,241,.06);
      color:#4f46e5; font-family:inherit; font-size:13.5px; font-weight:700;
      transition:.15s;
    }
    .lq-scan-btn svg { width:16px; height:16px }
    .lq-scan-btn:hover { background:rgba(99,102,241,.12); border-color:rgba(99,102,241,.55) }

    .lq-scan {
      position:fixed; inset:0; z-index:10000;
      display:flex; align-items:center; justify-content:center; padding:16px;
      background:rgba(2,6,23,.72); backdrop-filter:blur(6px);
    }
    .lq-scan-card {
      width:100%; max-width:380px; border-radius:18px; overflow:hidden;
      background:#fff; box-shadow:0 24px 60px rgba(2,6,23,.35);
    }
    [data-theme="dark"] .lq-scan-card { background:#111827 }
    .lq-scan-hd {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; font-size:14px; font-weight:800; color:#0f172a;
      border-bottom:1px solid rgba(148,163,184,.18);
    }
    [data-theme="dark"] .lq-scan-hd { color:#e2e8f0 }
    .lq-scan-x {
      width:30px; height:30px; display:flex; align-items:center; justify-content:center;
      border:none; background:transparent; color:#64748b; cursor:pointer; border-radius:8px;
    }
    .lq-scan-x svg { width:16px; height:16px }
    .lq-scan-view { position:relative; background:#000; aspect-ratio:1/1 }
    .lq-scan-view video { width:100%; height:100%; object-fit:cover; display:block }
    .lq-scan-frame {
      position:absolute; inset:14%; border-radius:14px;
      border:2.5px solid rgba(255,255,255,.9); box-shadow:0 0 0 9999px rgba(0,0,0,.28);
    }
    .lq-scan-msg { padding:12px 16px; text-align:center; font-size:12.5px; font-weight:600; color:#64748b }

    .login-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-top: 20px;
      font-size: 11px;
      color: var(--muted);
      opacity: .55;
      text-align: center;
      animation: cardUp .55s .12s cubic-bezier(.22,1,.36,1) both;
      padding-bottom: 4px;
    }
    .login-footer .dot { opacity: .5; }
    .login-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: opacity .15s;
    }
    .login-footer a:hover { opacity: 1; text-decoration: underline; }
    .fb-icon { color: #1877f2; }

    /* ── Mobile tweaks ── */
    @media (max-width: 480px) {
      .card { padding: 32px 22px 28px; border-radius: 24px; }
      .logo-ring { width: 72px; height: 72px; border-radius: 20px; }
      .logo-img  { width: 48px; height: 48px; }
      .logo-title { font-size: 22px; }
      .btn-login  { padding: 15px; font-size: 15px; border-radius: 14px; }
    }
    @media (max-width: 360px) {
      .card { padding: 28px 18px 24px; }
      .logo-title { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="wrap">
    <div class="card">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-ring">
          <img src="images/logo/LOGO.png" class="logo-img" alt="CAMCVC LOAN"
               onerror="this.style.display='none'">
        </div>
        <div class="logo-title">CAMCVC LOAN</div>
        <div class="logo-sub">Sign in to access your account</div>
      </div>

      <div class="divider">Enter your credentials</div>

      <!-- Username -->
      <div class="field">
        <label>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Username
        </label>
        <div class="field-inner">
          <span class="field-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input id="loginUser" type="text" placeholder="Username..."
                 autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>
      </div>

      <!-- PIN -->
      <div class="field">
        <label>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          PIN
        </label>
        <div class="field-inner pin-wrap">
          <span class="field-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input id="loginPin" type="password" inputmode="numeric"
                 placeholder="••••" autocomplete="current-password">
          <button class="pin-eye" type="button" onclick="togglePin(this)" title="Show/Hide PIN">
            <svg id="eyeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Error -->
      <div class="err-box" id="loginErr">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div class="err-content">
          <span id="loginErrMsg"></span>
          <div class="err-admin" id="loginErrAdmin">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 11.39 18a19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 3.18 2 2 0 0 1 4.11 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>Please contact</span>
            <a class="admin-link" href="https://www.facebook.com/SEREYROB22" target="_blank" rel="noopener noreferrer">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
              ADMIN
            </a>
          </div>
        </div>
      </div>

      <!-- Button -->
      <button class="btn-login" id="loginBtn" onclick="doLogin()">
        <span id="btnText">Sign In</span>
        <span class="spin" id="btnSpin"></span>
      </button>

      <div class="lq-or"><span>or</span></div>
      <button type="button" class="lq-scan-btn" onclick="lqOpenScanner()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="14" x2="14" y2="14.01"/><line x1="21" y1="14" x2="21" y2="14.01"/><line x1="14" y1="21" x2="14" y2="21.01"/><line x1="21" y1="21" x2="21" y2="21.01"/><line x1="17.5" y1="17.5" x2="17.5" y2="17.51"/></svg>
        Scan a QR code to sign in
      </button>

      <button type="button" class="lq-scan-btn" style="margin-top:9px" onclick="CamboQrLogin.open({ next: 'pages/loan-list.html' })">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M2 20h20"/></svg>
        Sign in by scanning with your phone
      </button>

    </div>

    <!-- camera overlay -->
    <div class="lq-scan" id="lqScan" style="display:none">
      <div class="lq-scan-card">
        <div class="lq-scan-hd">
          <span>Scan QR code</span>
          <button type="button" class="lq-scan-x" onclick="lqCloseScanner()" aria-label="close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="lq-scan-view">
          <video id="lqVideo" playsinline muted></video>
          <div class="lq-scan-frame"></div>
        </div>
        <div class="lq-scan-msg" id="lqScanMsg"></div>
        <canvas id="lqCanvas" style="display:none"></canvas>
      </div>
    </div>

    <footer class="login-footer">
      <span>© <span id="cpYear"></span> CAMCVC LOAN</span>
      <span class="dot">·</span>
      <span>Design By
        <a href="https://www.facebook.com/SEREYROB22" target="_blank" rel="noopener noreferrer">
          <svg class="fb-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          CAMBO
        </a>
      </span>
    </footer>
  </div>

<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/qr-login.js?v=1"></script>
<script>

/* ══════════════════════════════════════════════════════════════
   SIGN IN BY QR
   The code shown on an already signed-in device carries a one-time
   token. Either the phone's own camera opens the link (?lt=…), or the
   scanner below reads the code from this page.
   ══════════════════════════════════════════════════════════════ */
function _lqStoreAndGo(res, uname, pin) {
  var exp = res.expDate ? new Date(res.expDate + 'T23:59:59').getTime()
                        : Date.now() + 7 * 24 * 60 * 60 * 1000;
  localStorage.setItem('appAuth', JSON.stringify({
    u: uname, p: pin, name: res.name || uname, role: res.role || '',
    exp: exp, expDate: res.expDate || '', manages_teams: res.manages_teams || []
  }));
  if (res.photo_url) { try { localStorage.setItem('user_photo', res.photo_url); } catch(e) {} }
  var next = new URLSearchParams(location.search).get('next') || 'pages/loan-list.html';
  location.replace(next);
}

var _LQ_MSG = {
  used:    'This code has already been used — show a new one',
  expired: 'This code has expired — show a new one',
  invalid: 'That code is not valid',
  inactive:'This account is disabled — please contact Admin'
};

async function lqRedeem(token) {
  var r = await CamboAPI.post({
    action: 'qr_login_consume', token: token,
    device_id: window.CamboDevice ? CamboDevice.id() : '',
    label: window.CamboDevice ? CamboDevice.label() : ''
  });
  if (!r || !r.ok) {
    showErr(_LQ_MSG[(r && r.message) || 'invalid'] || 'That code is not valid', true);
    return false;
  }
  /* the token hands back the account's own credentials, so finish as a normal sign-in */
  var login = await CamboAPI.post({
    action: 'api_login', username: r.username, pin: r.pin,
    device_id: window.CamboDevice ? CamboDevice.id() : '',
    device_label: window.CamboDevice ? CamboDevice.label() : ''
  });
  if (!login || !login.ok) {
    showErr((login && login.message) || 'Could not sign in', true);
    return false;
  }
  _lqStoreAndGo(login, r.username, r.pin);
  return true;
}

/* A link opened by the phone's own camera app */
(function () {
  var t = null;
  try { t = new URLSearchParams(location.search).get('lt'); } catch(e) {}
  if (!t) return;
  window.addEventListener('load', function () { lqRedeem(t); });
})();

/* ── In-page scanner ── */
var _lqStream = null, _lqRaf = null, _lqBusy = false;

function _lqLoadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'assets/js/jsqr.js?v=1';
    s.onload = resolve;
    s.onerror = function(){ reject(new Error('scanner_load')); };
    document.head.appendChild(s);
  });
}

async function lqOpenScanner() {
  var box = document.getElementById('lqScan');
  var msg = document.getElementById('lqScanMsg');
  box.style.display = 'flex';
  msg.textContent = 'Opening the camera…';

  try { await _lqLoadJsQR(); }
  catch (e) { msg.textContent = 'Could not load the scanner'; return; }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    msg.textContent = 'This device has no camera';
    return;
  }
  try {
    _lqStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
  } catch (e) {
    /* the browser blocks the camera outside a secure context, and the user can refuse */
    msg.textContent = (e && e.name === 'NotAllowedError')
      ? 'Please allow camera access'
      : (location.protocol === 'https:' || location.hostname === 'localhost')
        ? 'Could not open the camera'
        : 'The camera only works over HTTPS';
    return;
  }

  var video = document.getElementById('lqVideo');
  video.srcObject = _lqStream;
  video.setAttribute('playsinline', 'true');
  await video.play();
  msg.textContent = 'Point the camera at the QR code';

  var cv  = document.getElementById('lqCanvas');
  var ctx = cv.getContext('2d', { willReadFrequently: true });

  var tick = function () {
    if (!_lqStream) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA && !_lqBusy) {
      cv.width  = video.videoWidth;
      cv.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, cv.width, cv.height);
      var img = ctx.getImageData(0, 0, cv.width, cv.height);
      var code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) {
        _lqBusy = true;
        msg.textContent = 'Signing in…';
        var tok = code.data;
        try {
          var u = new URL(code.data, location.href);
          tok = u.searchParams.get('lt') || code.data;
        } catch (e) {}
        lqCloseScanner();
        lqRedeem(tok).then(function (ok) { if (!ok) _lqBusy = false; });
        return;
      }
    }
    _lqRaf = requestAnimationFrame(tick);
  };
  _lqRaf = requestAnimationFrame(tick);
}

function lqCloseScanner() {
  if (_lqRaf) { cancelAnimationFrame(_lqRaf); _lqRaf = null; }
  if (_lqStream) {
    _lqStream.getTracks().forEach(function (t) { t.stop(); });
    _lqStream = null;
  }
  var box = document.getElementById('lqScan');
  if (box) box.style.display = 'none';
}

  /* Explain a forced sign-out, if that is why we are here */
  (function() {
    var why = '';
    try { why = sessionStorage.getItem('signout_reason') || ''; sessionStorage.removeItem('signout_reason'); } catch(e) {}
    if (why) window.addEventListener('load', function(){ showErr(why, true); });
  })();

  /* Redirect if already logged in */
  (function() {
    try {
      var a = JSON.parse(localStorage.getItem('appAuth') || 'null');
      if (a && a.u && a.p && (!a.exp || Date.now() < a.exp)) {
        location.replace('pages/loan-list.html');
      } else if (a && a.exp && Date.now() > a.exp) {
        localStorage.removeItem('appAuth');
      }
    } catch(e) {}
    if (location.search.indexOf('expired=1') !== -1) {
      showErr('Your session has expired — please sign in again', true);
    }
  })();

  function togglePin(btn) {
    var inp = document.getElementById('loginPin');
    var isText = inp.type === 'text';
    inp.type = isText ? 'password' : 'text';
    btn.querySelector('svg').style.opacity = isText ? '1' : '.45';
  }

  var _busy = false;
  var _failCount = 0;
  var _lastAlertTime = 0;

  function sendLoginFailAlert(reason, username, attempt) {
    var now = Date.now();
    if (now - _lastAlertTime < 5 * 60 * 1000) return; // max 1 alert per 5 min
    _lastAlertTime = now;
    try {
      CamboAPI.post({ action: 'login_alert', username: username, reason: reason, attempt: attempt });
    } catch(e) {}
  }

  async function doLogin() {
    if (_busy) return;
    var u = document.getElementById('loginUser').value.trim();
    var p = document.getElementById('loginPin').value.trim();
    document.getElementById('loginErr').style.display = 'none';

    if (!u) { showErr('Please enter your username'); document.getElementById('loginUser').focus(); return; }
    if (!p) { showErr('Please enter your PIN'); document.getElementById('loginPin').focus(); return; }

    _busy = true;
    document.getElementById('loginBtn').disabled = true;
    document.getElementById('btnText').style.opacity = '0';
    document.getElementById('btnSpin').style.display = 'block';

    try {
      var res = await CamboAPI.post({
        action: 'api_login', username: u, pin: p,
        device_id: window.CamboDevice ? CamboDevice.id() : '',
        device_label: window.CamboDevice ? CamboDevice.label() : ''
      });
      if (res && res.ok) {
        var _exp = res.expDate
          ? new Date(res.expDate + 'T23:59:59').getTime()
          : Date.now() + 7 * 24 * 60 * 60 * 1000;
        if (res.expDate && Date.now() > _exp) {
          _failCount++;
          showErr('Your account has expired — please contact Admin to renew access.', true);
          if (_failCount >= 2) sendLoginFailAlert('expired', u, _failCount);
        } else {
          _failCount = 0;
          localStorage.setItem('appAuth', JSON.stringify({
            u: u, p: p, name: res.name, role: res.role, exp: _exp, expDate: res.expDate || '',
            manages_teams: res.manages_teams || []
          }));
          if (res.photo_url) { try { localStorage.setItem('user_photo', res.photo_url); } catch(e) {} }
          var next = new URLSearchParams(location.search).get('next') || 'pages/loan-list.html';
          location.replace(next);
        }
      } else {
        _failCount++;
        showErr((res && res.message) || 'Incorrect username or PIN', true);
        if (_failCount >= 2) sendLoginFailAlert(res && res.code === 'locked' ? 'locked' : 'wrong', u, _failCount);
      }
    } catch(err) {
      showErr('Unable to connect to server — please check your internet', false);
    }

    _busy = false;
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('btnText').style.opacity = '1';
    document.getElementById('btnSpin').style.display = 'none';
  }

  function showErr(msg, showAdmin) {
    document.getElementById('loginErrMsg').textContent = msg;
    document.getElementById('loginErrAdmin').style.display = showAdmin ? 'flex' : 'none';
    document.getElementById('loginErr').style.display = 'flex';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  document.getElementById('cpYear').textContent = new Date().getFullYear();
</script>
</body>
